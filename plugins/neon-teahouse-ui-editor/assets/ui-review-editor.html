<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Editable Ui Review</title>
<style>:root{color-scheme:light dark;background:light-dark(rgb(255 255 255), rgb(24 24 24))}html,body{margin:0}body{box-sizing:border-box;padding:1rem;background:inherit}iframe{display:block;width:100%;height:calc(100vh - 2rem);margin:0 auto;border:0}</style>
</head>
<body>
<iframe allow="clipboard-write" referrerpolicy="no-referrer" title="Editable Ui Review" srcdoc="&lt;div id=&quot;neon-ui-review-demo&quot;&gt;
  &lt;style&gt;
    #neon-ui-review-demo {
      --nur-shell: light-dark(#f3f5f7, #101318);
      --nur-panel: light-dark(#ffffff, #181c22);
      --nur-panel-2: light-dark(#e8ebef, #20252d);
      --nur-line: light-dark(#c8ced6, #343b46);
      --nur-text: light-dark(#1b222c, #f2f5f8);
      --nur-muted: light-dark(#5f6875, #a7b0bd);
      --nur-active: light-dark(#116675, #79e6ef);
      --nur-active-strong: light-dark(#0d4c58, #b6f8fc);
      --nur-warn: light-dark(#8a5a11, #f0c56d);
      width: 100%;
      color: var(--nur-text);
      color-scheme: light dark;
      font-family: Inter, &quot;Microsoft YaHei&quot;, system-ui, sans-serif;
    }

    #neon-ui-review-demo * {
      box-sizing: border-box;
      letter-spacing: 0;
    }

    #neon-ui-review-demo button,
    #neon-ui-review-demo input,
    #neon-ui-review-demo textarea {
      font: inherit;
    }

    #neon-ui-review-demo .nur-shell {
      overflow: hidden;
      border: 1px solid var(--nur-line);
      border-radius: 6px;
      background: var(--nur-shell);
      box-shadow: 0 18px 45px light-dark(rgba(26, 34, 44, 0.14), rgba(0, 0, 0, 0.32));
    }

    #neon-ui-review-demo .nur-topbar {
      min-height: 48px;
      display: flex;
      align-items: center;
      gap: 10px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--nur-line);
      background: var(--nur-panel);
    }

    #neon-ui-review-demo .nur-brand {
      display: flex;
      align-items: center;
      gap: 8px;
      min-width: 0;
      margin-right: auto;
    }

    #neon-ui-review-demo .nur-brand-mark {
      width: 28px;
      height: 28px;
      display: grid;
      place-items: center;
      flex: 0 0 auto;
      border: 1px solid var(--nur-active);
      border-radius: 4px;
      color: var(--nur-active-strong);
      background: light-dark(rgba(17, 102, 117, 0.08), rgba(121, 230, 239, 0.08));
    }

    #neon-ui-review-demo .nur-brand-copy {
      min-width: 0;
    }

    #neon-ui-review-demo .nur-brand-copy strong,
    #neon-ui-review-demo .nur-brand-copy span {
      display: block;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #neon-ui-review-demo .nur-brand-copy strong {
      font-size: 13px;
      font-weight: 500;
    }

    #neon-ui-review-demo .nur-brand-copy span {
      margin-top: 1px;
      color: var(--nur-muted);
      font-size: 11px;
    }

    #neon-ui-review-demo .nur-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      min-width: 74px;
      color: var(--nur-muted);
      font-size: 12px;
      white-space: nowrap;
    }

    #neon-ui-review-demo .nur-status::before {
      content: &quot;&quot;;
      width: 7px;
      height: 7px;
      border-radius: 50%;
      background: var(--nur-warn);
    }

    #neon-ui-review-demo .nur-status[data-state=&quot;synced&quot;]::before {
      background: var(--nur-active);
    }

    #neon-ui-review-demo .nur-icon-button,
    #neon-ui-review-demo .nur-action-button {
      min-height: 32px;
      border: 1px solid var(--nur-line);
      border-radius: 4px;
      color: var(--nur-text);
      background: var(--nur-panel);
      cursor: pointer;
    }

    #neon-ui-review-demo .nur-icon-button {
      width: 32px;
      display: grid;
      place-items: center;
      padding: 0;
    }

    #neon-ui-review-demo .nur-action-button {
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 7px;
      padding: 0 11px;
      white-space: nowrap;
    }

    #neon-ui-review-demo .nur-action-button[data-primary=&quot;true&quot;] {
      border-color: var(--nur-active);
      color: light-dark(#ffffff, #071114);
      background: var(--nur-active);
    }

    #neon-ui-review-demo button:hover {
      border-color: var(--nur-active);
    }

    #neon-ui-review-demo button:disabled {
      cursor: wait;
      opacity: 0.65;
    }

    #neon-ui-review-demo .nur-workspace {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 242px;
      min-height: 448px;
    }

    #neon-ui-review-demo .nur-stage-region {
      min-width: 0;
      padding: 10px;
      background: var(--nur-panel-2);
    }

    #neon-ui-review-demo .nur-stagebar {
      min-height: 32px;
      display: flex;
      align-items: center;
      gap: 8px;
      margin-bottom: 8px;
      color: var(--nur-muted);
      font-size: 12px;
    }

    #neon-ui-review-demo .nur-stagebar strong {
      color: var(--nur-text);
      font-weight: 500;
    }

    #neon-ui-review-demo .nur-stagebar .nur-stage-meta {
      margin-left: auto;
      white-space: nowrap;
    }

    #neon-ui-review-demo .nur-canvas-frame {
      width: 100%;
      max-width: 760px;
      margin: 0 auto;
      border: 1px solid #36414c;
      background: #070b0f;
      box-shadow: 0 14px 32px rgba(0, 0, 0, 0.28);
    }

    #neon-ui-review-demo .nur-game-canvas {
      position: relative;
      width: 100%;
      aspect-ratio: 16 / 9;
      overflow: hidden;
      color: #eaf8fa;
      background: #0a1117;
      container-type: inline-size;
    }

    #neon-ui-review-demo .nur-scene-bg,
    #neon-ui-review-demo .nur-scene-shade {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
    }

    #neon-ui-review-demo .nur-scene-bg {
      object-fit: cover;
      opacity: 0.72;
    }

    #neon-ui-review-demo .nur-scene-shade {
      background: rgba(3, 8, 12, 0.38);
      pointer-events: none;
    }

    #neon-ui-review-demo .nur-editable {
      position: absolute;
      cursor: pointer;
      transition: outline-color 120ms ease, box-shadow 120ms ease;
    }

    #neon-ui-review-demo .nur-editable:hover {
      outline: 1px dashed rgba(121, 230, 239, 0.72);
      outline-offset: 2px;
    }

    #neon-ui-review-demo .nur-editable[data-selected=&quot;true&quot;] {
      z-index: 20;
      outline: 2px solid #79e6ef;
      outline-offset: 3px;
      box-shadow: 0 0 0 5px rgba(121, 230, 239, 0.13);
    }

    #neon-ui-review-demo .nur-character {
      object-fit: contain;
      object-position: center bottom;
      filter: drop-shadow(0 12px 18px rgba(0, 0, 0, 0.5));
    }

    #neon-ui-review-demo .nur-day-label {
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(121, 230, 239, 0.58);
      border-radius: 3px;
      color: #dffcff;
      background: rgba(5, 20, 26, 0.84);
      font-family: ui-monospace, Consolas, monospace;
      font-size: clamp(7px, 1.6cqw, 12px);
      white-space: nowrap;
    }

    #neon-ui-review-demo .nur-dialogue-panel {
      border: 1px solid rgba(121, 230, 239, 0.7);
      border-radius: 5px;
      background: rgba(4, 13, 19, 0.91);
      box-shadow: 0 12px 28px rgba(0, 0, 0, 0.42);
    }

    #neon-ui-review-demo .nur-speaker {
      display: flex;
      align-items: center;
      color: #ffd77a;
      font-size: clamp(8px, 1.8cqw, 14px);
      font-weight: 500;
      white-space: nowrap;
    }

    #neon-ui-review-demo .nur-dialogue-copy {
      display: flex;
      align-items: flex-start;
      color: #f0f7f8;
      font-size: clamp(8px, 1.9cqw, 15px);
      line-height: 1.52;
      overflow: hidden;
    }

    #neon-ui-review-demo .nur-choice {
      display: flex;
      align-items: center;
      padding: 0 4%;
      border: 1px solid rgba(237, 111, 186, 0.62);
      border-radius: 3px;
      color: #ffe8f5;
      background: rgba(45, 14, 34, 0.78);
      font-size: clamp(7px, 1.55cqw, 12px);
      line-height: 1.25;
      overflow: hidden;
    }

    #neon-ui-review-demo .nur-choice::before {
      content: &quot;◇&quot;;
      flex: 0 0 auto;
      margin-right: 5px;
      color: #ff9ed5;
    }

    #neon-ui-review-demo .nur-hud-bar {
      border: 1px solid rgba(121, 230, 239, 0.48);
      background: rgba(4, 13, 19, 0.88);
      box-shadow: 0 10px 24px rgba(0, 0, 0, 0.36);
    }

    #neon-ui-review-demo .nur-hud-item {
      display: flex;
      align-items: center;
      justify-content: center;
      border: 1px solid rgba(121, 230, 239, 0.42);
      color: #dffcff;
      background: rgba(5, 20, 26, 0.82);
      font-family: ui-monospace, Consolas, monospace;
      font-size: clamp(7px, 1.45cqw, 12px);
      white-space: nowrap;
    }

    #neon-ui-review-demo .nur-page-title {
      display: flex;
      align-items: center;
      border: 1px solid rgba(121, 230, 239, 0.58);
      color: #dffcff;
      background: rgba(5, 20, 26, 0.86);
      font-size: clamp(10px, 2cqw, 18px);
      font-weight: 500;
      white-space: nowrap;
    }

    #neon-ui-review-demo .nur-recipe-card {
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 0 5px;
      border: 1px solid rgba(237, 111, 186, 0.62);
      border-radius: 4px;
      color: #ffe8f5;
      background: rgba(45, 14, 34, 0.78);
      font-size: clamp(7px, 1.4cqw, 11px);
      line-height: 1.3;
      overflow: hidden;
    }

    #neon-ui-review-demo .nur-body-copy {
      display: flex;
      align-items: flex-start;
      color: #f0f7f8;
      font-size: clamp(8px, 1.55cqw, 13px);
      line-height: 1.5;
      overflow: hidden;
    }

    #neon-ui-review-demo .nur-end-quote {
      display: flex;
      align-items: center;
      border-left: 3px solid #ffd77a;
      color: #ffe3a1;
      background: rgba(20, 14, 4, 0.48);
      font-family: ui-monospace, Consolas, monospace;
      font-size: clamp(7px, 1.35cqw, 11px);
      line-height: 1.4;
      overflow: hidden;
    }

    #neon-ui-review-demo .nur-inspector {
      min-width: 0;
      border-left: 1px solid var(--nur-line);
      background: var(--nur-panel);
    }

    #neon-ui-review-demo .nur-inspector-header {
      padding: 11px 12px 10px;
      border-bottom: 1px solid var(--nur-line);
    }

    #neon-ui-review-demo .nur-inspector-kicker {
      color: var(--nur-muted);
      font-size: 11px;
    }

    #neon-ui-review-demo .nur-inspector-header strong {
      display: block;
      margin-top: 3px;
      overflow: hidden;
      text-overflow: ellipsis;
      color: var(--nur-active-strong);
      font-family: ui-monospace, Consolas, monospace;
      font-size: 12px;
      font-weight: 500;
      white-space: nowrap;
    }

    #neon-ui-review-demo .nur-inspector-section {
      padding: 11px 12px;
      border-bottom: 1px solid var(--nur-line);
    }

    #neon-ui-review-demo .nur-section-title {
      display: flex;
      align-items: center;
      margin-bottom: 9px;
      color: var(--nur-text);
      font-size: 12px;
      font-weight: 500;
    }

    #neon-ui-review-demo .nur-field {
      display: block;
      margin-bottom: 9px;
    }

    #neon-ui-review-demo .nur-field:last-child {
      margin-bottom: 0;
    }

    #neon-ui-review-demo .nur-field &gt; span,
    #neon-ui-review-demo .nur-mini-field &gt; span {
      display: block;
      margin-bottom: 4px;
      color: var(--nur-muted);
      font-size: 11px;
    }

    #neon-ui-review-demo .nur-field textarea,
    #neon-ui-review-demo .nur-field input[type=&quot;text&quot;],
    #neon-ui-review-demo .nur-mini-field input[type=&quot;number&quot;] {
      width: 100%;
      border: 1px solid var(--nur-line);
      border-radius: 3px;
      color: var(--nur-text);
      background: var(--nur-shell);
    }

    #neon-ui-review-demo .nur-field textarea {
      min-height: 66px;
      resize: vertical;
      padding: 7px 8px;
      line-height: 1.45;
    }

    #neon-ui-review-demo .nur-field input[type=&quot;text&quot;],
    #neon-ui-review-demo .nur-mini-field input[type=&quot;number&quot;] {
      height: 30px;
      padding: 0 7px;
    }

    #neon-ui-review-demo .nur-field input:disabled,
    #neon-ui-review-demo .nur-field textarea:disabled {
      opacity: 0.55;
    }

    #neon-ui-review-demo .nur-four-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 7px;
    }

    #neon-ui-review-demo .nur-two-grid {
      display: grid;
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 8px;
    }

    #neon-ui-review-demo .nur-color-field {
      display: flex;
      align-items: center;
      gap: 6px;
      min-width: 0;
    }

    #neon-ui-review-demo .nur-color-field input[type=&quot;color&quot;] {
      width: 34px;
      height: 30px;
      flex: 0 0 auto;
      padding: 2px;
      border: 1px solid var(--nur-line);
      border-radius: 3px;
      background: var(--nur-shell);
    }

    #neon-ui-review-demo .nur-color-field code {
      overflow: hidden;
      color: var(--nur-muted);
      font-size: 10px;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #neon-ui-review-demo .nur-toggle-row {
      display: flex;
      align-items: center;
      gap: 8px;
      min-height: 30px;
      color: var(--nur-text);
      font-size: 12px;
    }

    #neon-ui-review-demo .nur-toggle-row input {
      width: 16px;
      height: 16px;
      accent-color: var(--nur-active);
    }

    #neon-ui-review-demo .nur-meta-row {
      display: grid;
      grid-template-columns: 64px minmax(0, 1fr);
      gap: 7px;
      align-items: center;
      margin-bottom: 6px;
      font-size: 11px;
    }

    #neon-ui-review-demo .nur-meta-row:last-child {
      margin-bottom: 0;
    }

    #neon-ui-review-demo .nur-meta-row span {
      color: var(--nur-muted);
    }

    #neon-ui-review-demo .nur-meta-row code {
      overflow: hidden;
      color: var(--nur-text);
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    #neon-ui-review-demo .nur-inspector-footer {
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 8px;
      padding: 11px 12px;
    }

    #neon-ui-review-demo .nur-inspector-footer .nur-action-button {
      width: 100%;
      padding: 0 7px;
      font-size: 12px;
    }

    #neon-ui-review-demo .nur-stage-note {
      display: flex;
      align-items: center;
      gap: 7px;
      width: 100%;
      max-width: 760px;
      min-height: 34px;
      margin: 8px auto 0;
      padding: 7px 9px;
      border-left: 2px solid var(--nur-active);
      color: var(--nur-muted);
      background: var(--nur-panel);
      font-size: 11px;
    }

    #neon-ui-review-demo .nur-stage-note strong {
      color: var(--nur-text);
      font-weight: 500;
    }

    #neon-ui-review-demo .nur-tool-strip {
      display: grid;
      gap: 8px;
      width: 100%;
      max-width: 760px;
      margin: 8px auto 0;
    }

    #neon-ui-review-demo .nur-tool-row {
      display: flex;
      flex-wrap: wrap;
      align-items: center;
      gap: 6px 8px;
      color: var(--nur-muted);
      font-size: 11px;
    }

    #neon-ui-review-demo .nur-tool-row .nur-section-title {
      margin: 0;
      min-width: 52px;
    }

    #neon-ui-review-demo .nur-tool-output {
      display: grid;
      gap: 4px;
      padding: 8px 9px;
      border-left: 2px solid var(--nur-warn);
      color: var(--nur-text);
      background: var(--nur-panel);
      font-size: 11px;
    }

    #neon-ui-review-demo .nur-tool-output[hidden] {
      display: none;
    }

    #neon-ui-review-demo .nur-tool-output strong {
      color: var(--nur-warn);
      font-weight: 500;
    }

    #neon-ui-review-demo .nur-matrix-grid {
      display: grid;
      grid-template-columns: repeat(3, minmax(0, 1fr));
      gap: 6px;
    }

    #neon-ui-review-demo .nur-matrix-cell {
      min-height: 42px;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      gap: 2px;
      border: 1px solid var(--nur-line);
      border-radius: 4px;
      padding: 5px;
      color: var(--nur-muted);
      background: var(--nur-shell);
      cursor: pointer;
      font-size: 11px;
    }

    #neon-ui-review-demo .nur-matrix-cell[data-level=&quot;changed&quot;] {
      border-color: var(--nur-warn);
      color: var(--nur-warn);
      background: light-dark(rgba(138, 90, 17, 0.08), rgba(240, 197, 109, 0.08));
    }

    #neon-ui-review-demo .nur-matrix-cell[data-level=&quot;same&quot;] {
      border-color: var(--nur-active);
      color: var(--nur-active-strong);
      background: light-dark(rgba(17, 102, 117, 0.08), rgba(121, 230, 239, 0.08));
    }

    #neon-ui-review-demo .nur-matrix-cell small {
      color: var(--nur-muted);
      font-size: 10px;
    }

    #neon-ui-review-demo .nur-validation-summary {
      color: var(--nur-muted);
    }

    #neon-ui-review-demo .nur-validation-summary[data-state=&quot;ok&quot;] {
      color: var(--nur-active);
    }

    #neon-ui-review-demo .nur-validation-summary[data-state=&quot;error&quot;] {
      color: var(--nur-warn);
    }

    #neon-ui-review-demo .nur-page-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 6px;
      width: 100%;
      max-width: 760px;
      margin: 0 auto 8px;
    }

    #neon-ui-review-demo .nur-page-tab {
      min-height: 30px;
      border: 1px solid var(--nur-line);
      border-radius: 4px;
      padding: 0 10px;
      color: var(--nur-muted);
      background: var(--nur-panel);
      cursor: pointer;
      font-size: 12px;
    }

    #neon-ui-review-demo .nur-page-tab[aria-selected=&quot;true&quot;] {
      border-color: var(--nur-active);
      color: var(--nur-active-strong);
      background: light-dark(rgba(17, 102, 117, 0.09), rgba(121, 230, 239, 0.09));
    }

    #neon-ui-review-demo .nur-archive-list {
      display: grid;
      gap: 4px;
      max-height: 132px;
      overflow: auto;
      padding-right: 2px;
    }

    #neon-ui-review-demo .nur-archive-row {
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 8px;
      min-height: 30px;
      padding: 4px 6px 4px 9px;
      border: 1px solid var(--nur-line);
      border-radius: 4px;
      color: var(--nur-muted);
      background: var(--nur-panel);
      font-size: 11px;
    }

    #neon-ui-review-demo .nur-archive-row time {
      color: var(--nur-text);
    }

    #neon-ui-review-demo .nur-mini-button {
      min-height: 26px;
      border: 1px solid var(--nur-line);
      border-radius: 4px;
      padding: 0 8px;
      color: var(--nur-text);
      background: var(--nur-panel);
      cursor: pointer;
      font-size: 11px;
    }

    #neon-ui-review-demo .nur-inline-form {
      display: flex;
      align-items: center;
      gap: 6px;
      width: 100%;
    }

    #neon-ui-review-demo .nur-inline-form input[type=&quot;text&quot;] {
      flex: 1;
      min-width: 0;
      height: 30px;
      border: 1px solid var(--nur-line);
      border-radius: 3px;
      padding: 0 7px;
      color: var(--nur-text);
      background: var(--nur-shell);
      font-size: 11px;
    }

    @media (max-width: 680px) {
      #neon-ui-review-demo .nur-topbar {
        flex-wrap: wrap;
      }

      #neon-ui-review-demo .nur-brand {
        flex: 1 1 calc(100% - 90px);
      }

      #neon-ui-review-demo .nur-workspace {
        grid-template-columns: 1fr;
      }

      #neon-ui-review-demo .nur-inspector {
        border-top: 1px solid var(--nur-line);
        border-left: 0;
      }

      #neon-ui-review-demo .nur-inspector-footer {

      const snapshot = (element) =&gt; {
        const copy = element.querySelector(&quot;[data-review-copy]&quot;);
        return {
          style: element.getAttribute(&quot;style&quot;) || &quot;&quot;,
          text: copy ? copy.textContent : null,
          textColor: element.dataset.textColor || &quot;#ffffff&quot;,
          backgroundColor: element.dataset.backgroundColor || &quot;#000000&quot;,
          uType: element.dataset.uType,
          uName: element.dataset.uName,
          visible: element.style.visibility !== &quot;hidden&quot;,
          layout: {
            xPercent: Number.parseFloat(element.style.left),
            yPercent: Number.parseFloat(element.style.top),
            widthPercent: Number.parseFloat(element.style.width),
            heightPercent: Number.parseFloat(element.style.height)
          },
          fontSizePx: copy ? Number.parseFloat(element.style.fontSize) : null
        };
      };

      const cloneState = (state) =&gt; ({
        ...state,
        layout: { ...(state.layout || {}) }
      });

      const snapshotElements = (elements) =&gt; elements.map((element) =&gt; ({
        id: element.dataset.reviewId,
        state: snapshot(element)
      }));

      const cloneStates = (states) =&gt; states.map((entry) =&gt; ({
        id: entry.id,
        state: cloneState(entry.state)
      }));

      const getPageDefinition = (pageId) =&gt; pageDefinitions.find((item) =&gt; item.id === pageId);

      const getPageElements = (pageId) =&gt; {
        const container = pageContainers.get(pageId);
        return container ? Array.from(container.querySelectorAll(&quot;.nur-editable[data-review-id]&quot;)) : [];
      };

      const createPageElement = (descriptor) =&gt; {
        const tag = descriptor.tag || &quot;div&quot;;
        const element = document.createElement(tag);
        element.className = `nur-editable ${descriptor.className || &quot;&quot;}`.trim();
        element.dataset.reviewId = descriptor.reviewId;
        element.dataset.uType = descriptor.uType;
        element.dataset.uName = descriptor.uName;
        element.dataset.textColor = descriptor.textColor || &quot;#ffffff&quot;;
        element.dataset.backgroundColor = descriptor.backgroundColor || &quot;#000000&quot;;
        Object.entries(descriptor.style || {}).forEach(([property, value]) =&gt; {
          element.style[property] = value;
        });
        if (tag === &quot;img&quot;) {
          if (descriptor.src) element.src = descriptor.src;
          if (descriptor.alt) element.alt = descriptor.alt;
        } else if (descriptor.text !== null &amp;&amp; descriptor.text !== undefined) {
          const copy = document.createElement(&quot;span&quot;);
          copy.dataset.reviewCopy = &quot;&quot;;
          copy.textContent = descriptor.text;
          element.appendChild(copy);
        }
        (descriptor.children || []).forEach((child) =&gt; {
          element.appendChild(createPageElement(child));
        });
        return element;
      };

      const buildPageContainers = () =&gt; {
        const dialogueContainer = document.createElement(&quot;div&quot;);
        dialogueContainer.dataset.page = &quot;01-dialogue-panel&quot;;
        Array.from(canvas.querySelectorAll(&quot;:scope &gt; .nur-editable[data-review-id]&quot;)).forEach((element) =&gt; {
          dialogueContainer.appendChild(element);
        });
        canvas.appendChild(dialogueContainer);
        pageContainers.set(&quot;01-dialogue-panel&quot;, dialogueContainer);

        pageDefinitions.forEach((definition) =&gt; {
          if (definition.id === &quot;01-dialogue-panel&quot;) return;
          const container = document.createElement(&quot;div&quot;);
          container.dataset.page = definition.id;
          container.hidden = true;
          definition.elements.forEach((descriptor) =&gt; {
            container.appendChild(createPageElement(descriptor));
          });
          canvas.appendChild(container);
          pageContainers.set(definition.id, container);
        });
      };

      const syncActivePageState = () =&gt; {
        if (!activePageId || !pageContainers.has(activePageId)) return;
        statesByPage.set(activePageId, snapshotElements(getPageElements(activePageId)));
      };

      const snapshotAll = () =&gt; {
        syncActivePageState();
        const result = {};
        pageContainers.forEach((container, pageId) =&gt; {
          result[pageId] = cloneStates(statesByPage.get(pageId) || []);
        });
        return result;
      };

      const applyElementStates = (elements, states) =&gt; {
        const byId = new Map(elements.map((element) =&gt; [element.dataset.reviewId, element]));
        states.forEach(({ id, state }) =&gt; {
          const element = byId.get(id);
          if (element) restore(element, state);
        });
      };

      const restoreAll = (snapshot) =&gt; {
        Object.entries(snapshot || {}).forEach(([pageId, states]) =&gt; {
          if (!pageContainers.has(pageId)) return;
          statesByPage.set(pageId, cloneStates(states));
        });
        const restoredStates = statesByPage.get(activePageId) || [];
        applyElementStates(currentEditables, restoredStates);
        currentEditables.forEach(applyColors);
        renderInspector();
        updateHistoryButtons();
      };

      const updatePageTabs = () =&gt; {
        if (!pageTabs) return;
        pageTabs.innerHTML = &quot;&quot;;
        pageDefinitions.forEach((definition) =&gt; {
          const button = document.createElement(&quot;button&quot;);
          button.type = &quot;button&quot;;
          button.className = &quot;nur-page-tab&quot;;
          button.textContent = definition.label;
          button.setAttribute(&quot;aria-selected&quot;, definition.id === activePageId ? &quot;true&quot; : &quot;false&quot;);
          button.addEventListener(&quot;click&quot;, () =&gt; renderPage(definition.id));
          pageTabs.appendChild(button);
        });
      };

      const updateStageMeta = () =&gt; {
        const definition = getPageDefinition(activePageId);
        if (!definition) return;
        if (brandSubtitle) brandSubtitle.textContent = `${definition.id} · 1920 × 1080`;
        if (stageTitle) stageTitle.textContent = definition.title;
        canvas.setAttribute(&quot;aria-label&quot;, `可编辑的霓虹茶舍${definition.label}页面切片`);
      };

      const renderPage = (pageId) =&gt; {
        const definition = getPageDefinition(pageId);
        if (!definition) return;
        syncActivePageState();
        activePageId = pageId;
        pageContainers.forEach((container, id) =&gt; {
          container.hidden = id !== pageId;
        });
        currentEditables = getPageElements(pageId);
        if (!statesByPage.has(pageId)) {
          statesByPage.set(pageId, cloneStates(defaultsByPage.get(pageId) || []));
        }
        applyElementStates(currentEditables, statesByPage.get(pageId));
        currentEditables.forEach(applyColors);
        updatePageTabs();
        updateStageMeta();
        renderSnapshotDiff(null);
        const defaultElement = currentEditables.find((element) =&gt; element.dataset.reviewId === definition.defaultReviewId) || currentEditables[0];
        if (defaultElement) selectElement(defaultElement);
        renderInspector();
      };

      const pushHistory = () =&gt; {
        undoStack.push(snapshotAll());
        if (undoStack.length &gt; 50) undoStack.shift();
        redoStack = [];
        updateHistoryButtons();
      };

      const updateHistoryButtons = () =&gt; {
        undoButton.disabled = undoStack.length === 0;
        redoButton.disabled = redoStack.length === 0;
      };

      const persistDraft = () =&gt; {
        try {
          localStorage.setItem(storageKey, JSON.stringify({
            draft: collectReviewData(),
            archives: archiveVersions,
            annotations: annotations
          }));
        } catch {
          // The editor still works without storage in restricted contexts.
        }
      };

      const loadPersisted = () =&gt; {
        try {
          const raw = localStorage.getItem(storageKey);
          return raw ? JSON.parse(raw) : null;
        } catch {
          return null;
        }
      };

      const numberFromStyle = (element, property, fallback) =&gt; {
        const value = Number.parseFloat(element.style[property]);
        return Number.isFinite(value) ? value : fallback;
      };

      const setDirty = () =&gt; {
        status.textContent = &quot;未同步&quot;;
        status.dataset.state = &quot;dirty&quot;;
        persistDraft();
      };

      const applyColors = (element) =&gt; {
        if (element.matches(&quot;img&quot;)) return;
        element.style.color = element.dataset.textColor;
        element.style.backgroundColor = element.dataset.backgroundColor;
      };

      const renderInspector = () =&gt; {
        if (!selected) return;
        const copy = selected.querySelector(&quot;[data-review-copy]&quot;);
        const hasText = Boolean(copy);
        selectedId.textContent = selected.dataset.reviewId;
        stageNote.textContent = selected.dataset.uName;
        textValue.disabled = !hasText;
        textValue.value = hasText ? copy.textContent : &quot;&quot;;
        textValue.placeholder = hasText ? &quot;&quot; : &quot;该控件没有可编辑文案&quot;;
        posX.value = numberFromStyle(selected, &quot;left&quot;, 0);
        posY.value = numberFromStyle(selected, &quot;top&quot;, 0);
        sizeW.value = numberFromStyle(selected, &quot;width&quot;, 10);
        sizeH.value = numberFromStyle(selected, &quot;height&quot;, 10);
        fontSize.disabled = !hasText;
        fontSize.value = hasText ? String(numberFromStyle(selected, &quot;fontSize&quot;, 14)) : &quot;&quot;;
        textColor.disabled = !hasText;
        textColor.value = selected.dataset.textColor || &quot;#ffffff&quot;;
        backgroundColor.disabled = selected.matches(&quot;img&quot;);
        backgroundColor.value = selected.dataset.backgroundColor || &quot;#000000&quot;;
        textColorCode.textContent = textColor.value;
        backgroundColorCode.textContent = backgroundColor.value;
        visible.checked = selected.style.visibility !== &quot;hidden&quot;;
        uType.textContent = selected.dataset.uType;
        uName.textContent = selected.dataset.uName;
      };

      const selectElement = (element) =&gt; {
        currentEditables.forEach((item) =&gt; { item.dataset.selected = &quot;false&quot;; });
        selected = element;
        selected.dataset.selected = &quot;true&quot;;
        renderInspector();
        updateAnnotationTarget();
      };

      const restore = (element, state) =&gt; {
        element.setAttribute(&quot;style&quot;, state.style);
        element.dataset.textColor = state.textColor;
        element.dataset.backgroundColor = state.backgroundColor;
        element.style.visibility = state.visible ? &quot;visible&quot; : &quot;hidden&quot;;
        const copy = element.querySelector(&quot;[data-review-copy]&quot;);
        if (copy &amp;&amp; state.text !== null) copy.textContent = state.text;
        applyColors(element);
      };

      canvas.addEventListener(&quot;click&quot;, (event) =&gt; {
        const target = event.target.closest(&quot;.nur-editable[data-review-id]&quot;);
        if (target &amp;&amp; pageContainers.get(activePageId)?.contains(target)) {
          event.preventDefault();
          selectElement(target);
          return;
        }
        if (selected) selectElement(selected);
      });

      textValue.addEventListener(&quot;input&quot;, () =&gt; {
        if (!selected) return;
        const copy = selected.querySelector(&quot;[data-review-copy]&quot;);
        if (!copy) return;
        pushHistory();
        copy.textContent = textValue.value;
        setDirty();
      });

      const bindPercent = (input, property) =&gt; {
        input.addEventListener(&quot;input&quot;, () =&gt; {
          if (!selected) return;
          const value = Number.parseFloat(input.value);
          if (!Number.isFinite(value)) return;
          pushHistory();
          selected.style[property] = `${value}%`;
          setDirty();
        });
      };

      bindPercent(posX, &quot;left&quot;);
      bindPercent(posY, &quot;top&quot;);
      bindPercent(sizeW, &quot;width&quot;);
      bindPercent(sizeH, &quot;height&quot;);

      fontSize.addEventListener(&quot;input&quot;, () =&gt; {
        if (!selected || fontSize.disabled) return;
        const value = Number.parseFloat(fontSize.value);
        if (!Number.isFinite(value)) return;
        pushHistory();
        selected.style.fontSize = `${Math.max(6, Math.min(72, value))}px`;
        setDirty();
      });

      textColor.addEventListener(&quot;input&quot;, () =&gt; {
        if (!selected || textColor.disabled) return;
        pushHistory();
        selected.dataset.textColor = textColor.value;
        textColorCode.textContent = textColor.value;
        applyColors(selected);
        setDirty();
      });

      backgroundColor.addEventListener(&quot;input&quot;, () =&gt; {
        if (!selected || backgroundColor.disabled) return;
        pushHistory();
        selected.dataset.backgroundColor = backgroundColor.value;
        backgroundColorCode.textContent = backgroundColor.value;
        applyColors(selected);
        setDirty();
      });

      visible.addEventListener(&quot;change&quot;, () =&gt; {
        if (!selected) return;
        pushHistory();
        selected.style.visibility = visible.checked ? &quot;visible&quot; : &quot;hidden&quot;;
        setDirty();
      });

      resetSelectedButton.addEventListener(&quot;click&quot;, () =&gt; {
        if (!selected) return;
        pushHistory();
        const defaultEntry = (defaultsByPage.get(activePageId) || []).find((entry) =&gt; entry.id === selected.dataset.reviewId);
        if (defaultEntry) restore(selected, defaultEntry.state);
        syncActivePageState();
        renderInspector();
        setDirty();
      });

      resetAllButton.addEventListener(&quot;click&quot;, () =&gt; {
        pushHistory();
        const defaultStates = defaultsByPage.get(activePageId) || [];
        currentEditables.forEach((element) =&gt; {
          const defaultEntry = defaultStates.find((entry) =&gt; entry.id === element.dataset.reviewId);
          if (defaultEntry) restore(element, defaultEntry.state);
        });
        syncActivePageState();
        renderInspector();
        setDirty();
      });

      undoButton.addEventListener(&quot;click&quot;, () =&gt; {
        if (undoStack.length === 0) return;
        redoStack.push(snapshotAll());
        restoreAll(undoStack.pop());
        updateHistoryButtons();
        setDirty();
      });

      redoButton.addEventListener(&quot;click&quot;, () =&gt; {
        if (redoStack.length === 0) return;
        undoStack.push(snapshotAll());
        restoreAll(redoStack.pop());
        updateHistoryButtons();
        setDirty();
      });

      focusSelectedButton.addEventListener(&quot;click&quot;, () =&gt; {
        if (!selected) return;
        selected.animate(
          [
            { boxShadow: &quot;0 0 0 5px rgba(121, 230, 239, 0.13)&quot; },
            { boxShadow: &quot;0 0 0 10px rgba(121, 230, 239, 0.28)&quot; },
            { boxShadow: &quot;0 0 0 5px rgba(121, 230, 239, 0.13)&quot; }
          ],
          { duration: 420, easing: &quot;ease-out&quot; }
        );
      });

      const stateToReviewItem = (entry) =&gt; {
        const state = entry.state;
        const layout = state.layout || {};
        return {
          id: entry.id,
          uType: state.uType || &quot;div&quot;,
          uName: state.uName || entry.id,
          text: state.text === undefined ? null : state.text,
          layout: {
            xPercent: layout.xPercent,
            yPercent: layout.yPercent,
            widthPercent: layout.widthPercent,
            heightPercent: layout.heightPercent
          },
          style: {
            fontSizePx: state.fontSizePx,
            textColor: state.textColor,
            backgroundColor: state.backgroundColor
          },
          visible: state.visible !== false
        };
      };

      const collectReviewData = () =&gt; {
        syncActivePageState();
        return {
          schema: &quot;neon-teahouse-ui-review/v2&quot;,
          referenceResolution: { width: 1920, height: 1080 },
          pages: pageDefinitions.map((definition) =&gt; ({
            pageId: definition.id,
            label: definition.label,
            elements: (statesByPage.get(definition.id) || []).map(stateToReviewItem)
          })),
          annotations: annotations.map((annotation) =&gt; ({ ...annotation }))
        };
      };

      const itemToElementState = (item) =&gt; {
        const layout = item.layout || {};
        const style = item.style || {};
        const state = {
          style: &quot;&quot;,
          text: typeof item.text === &quot;string&quot; ? item.text : null,
          textColor: typeof style.textColor === &quot;string&quot; ? style.textColor : &quot;#ffffff&quot;,
          backgroundColor: typeof style.backgroundColor === &quot;string&quot; ? style.backgroundColor : &quot;#000000&quot;,
          uType: item.uType || &quot;div&quot;,
          uName: item.uName || item.id,
          visible: item.visible !== false,
          layout: {
            xPercent: typeof layout.xPercent === &quot;number&quot; ? layout.xPercent : 0,
            yPercent: typeof layout.yPercent === &quot;number&quot; ? layout.yPercent : 0,
            widthPercent: typeof layout.widthPercent === &quot;number&quot; ? layout.widthPercent : 10,
            heightPercent: typeof layout.heightPercent === &quot;number&quot; ? layout.heightPercent : 10
          },
          fontSizePx: typeof style.fontSizePx === &quot;number&quot; ? style.fontSizePx : null
        };
        state.style = `left:${state.layout.xPercent}%;top:${state.layout.yPercent}%;width:${state.layout.widthPercent}%;height:${state.layout.heightPercent}%;`;
        if (state.fontSizePx !== null) state.style += `font-size:${state.fontSizePx}px;`;
        return state;
      };

      const normalizeReviewPages = (payload) =&gt; {
        if (!payload) return [];
        if (Array.isArray(payload.pages)) {
          return payload.pages.filter((page) =&gt; page &amp;&amp; Array.isArray(page.elements)).map((page) =&gt; ({
            pageId: page.pageId,
            label: page.label || page.pageId,
            elements: page.elements
          }));
        }
        if (Array.isArray(payload.elements)) {
          return [{
            pageId: payload.pageId || activePageId,
            label: payload.pageId || activePageId,
            elements: payload.elements
          }];
        }
        return [];
      };

      const applyReviewData = (payload) =&gt; {
        const pages = normalizeReviewPages(payload);
        if (pages.length === 0) return false;
        pages.forEach((page) =&gt; {
          if (!pageContainers.has(page.pageId)) return;
          const elements = getPageElements(page.pageId);
          const byId = new Map(elements.map((element) =&gt; [element.dataset.reviewId, element]));
          const nextStates = page.elements.map((item) =&gt; {
            const element = byId.get(item.id);
            if (!element) return null;
            const state = itemToElementState(item);
            restore(element, state);
            return { id: item.id, state };
          }).filter(Boolean);
          statesByPage.set(page.pageId, nextStates);
        });
        if (Array.isArray(payload.annotations)) {
          annotations = payload.annotations
            .filter((annotation) =&gt; annotation &amp;&amp; typeof annotation.id === &quot;string&quot; &amp;&amp; typeof annotation.text === &quot;string&quot;)
            .map((annotation) =&gt; ({ ...annotation }));
        }
        if (activePageId &amp;&amp; pageContainers.has(activePageId)) {
          renderPage(activePageId);
        }
        renderAnnotationList();
        renderInspector();
        return true;
      };

      const validateReviewData = (payload) =&gt; {
        const issues = [];
        const pages = normalizeReviewPages(payload);
        pages.forEach((page) =&gt; {
          const ids = new Set();
          page.elements.forEach((item, index) =&gt; {
            const label = `${page.pageId}:${item.id || `elements[${index}]`}`;
            if (!item.id) issues.push(`${label}: 缺少 id`);
            else if (ids.has(item.id)) issues.push(`${label}: 重复 id`);
            else ids.add(item.id);
            if (!item.uName) issues.push(`${label}: 缺少 uName`);
            const layout = item.layout || {};
            const percentages = [layout.xPercent, layout.yPercent, layout.widthPercent, layout.heightPercent];
            if (percentages.some((value) =&gt; typeof value !== &quot;number&quot; || !Number.isFinite(value) || value &lt; 0 || value &gt; 100)) {
              issues.push(`${label}: 布局百分比越界`);
            }
            if ((item.uType === &quot;text&quot; || item.uType === &quot;button&quot;) &amp;&amp; typeof item.text === &quot;string&quot; &amp;&amp; !item.text.trim()) {
              issues.push(`${label}: 文案为空`);
            }
          });
        });
        return issues;
      };

      const renderValidation = () =&gt; {
        const issues = validateReviewData(collectReviewData());
        validationSummary.textContent = issues.length === 0 ? &quot;校验通过&quot; : `${issues.length} 个问题`;
        validationSummary.dataset.state = issues.length === 0 ? &quot;ok&quot; : &quot;error&quot;;
        validationOutput.hidden = issues.length === 0;
        validationOutput.innerHTML = &quot;&quot;;
        issues.slice(0, 8).forEach((issue) =&gt; {
          const row = document.createElement(&quot;div&quot;);
          const mark = document.createElement(&quot;strong&quot;);
          mark.textContent = &quot;待修&quot;;
          const text = document.createElement(&quot;span&quot;);
          text.textContent = issue;
          row.append(mark, text);
          validationOutput.appendChild(row);
        });
      };

      const getPageLabel = (pageId) =&gt; getPageDefinition(pageId)?.label || pageId;

      const updateAnnotationTarget = () =&gt; {
        if (!annotationTarget) return;
        const pageLabel = getPageLabel(activePageId);
        annotationTarget.textContent = selected ? `${pageLabel} · ${selected.dataset.uName}` : pageLabel;
      };

      const renderAnnotationList = () =&gt; {
        annotationList.innerHTML = &quot;&quot;;
        if (annotations.length === 0) {
          const empty = document.createElement(&quot;div&quot;);
          empty.className = &quot;nur-archive-row&quot;;
          empty.textContent = &quot;暂无批注&quot;;
          annotationList.appendChild(empty);
          return;
        }
        annotations.forEach((annotation) =&gt; {
          const row = document.createElement(&quot;div&quot;);
          row.className = &quot;nur-archive-row&quot;;
          const content = document.createElement(&quot;span&quot;);
          const target = annotation.reviewId || &quot;当前页&quot;;
          content.textContent = `${getPageLabel(annotation.pageId)} · ${target}: ${annotation.text}`;
          const deleteButton = document.createElement(&quot;button&quot;);
          deleteButton.type = &quot;button&quot;;
          deleteButton.className = &quot;nur-mini-button&quot;;
          deleteButton.textContent = &quot;删除&quot;;
          deleteButton.addEventListener(&quot;click&quot;, () =&gt; {
            annotations = annotations.filter((item) =&gt; item.id !== annotation.id);
            renderAnnotationList();
            persistDraft();
            status.textContent = &quot;已删除批注&quot;;
            status.dataset.state = &quot;synced&quot;;
          });
          row.append(content, deleteButton);
          annotationList.appendChild(row);
        });
      };

      const diffStates = (baseline, current) =&gt; {
        const before = new Map(baseline.map((entry) =&gt; [entry.id, entry.state]));
        const after = new Map(current.map((entry) =&gt; [entry.id, entry.state]));
        const ids = new Set([...before.keys(), ...after.keys()]);
        const normalizeDiffValue = (value) =&gt; {
          if (value === null || value === undefined) return null;
          if (typeof value === &quot;number&quot; &amp;&amp; Number.isNaN(value)) return null;
          return value;
        };
        const fieldLabels = {
          text: &quot;文案&quot;,
          xPercent: &quot;X&quot;,
          yPercent: &quot;Y&quot;,
          widthPercent: &quot;宽度&quot;,
          heightPercent: &quot;高度&quot;,
          fontSizePx: &quot;字号&quot;,
          textColor: &quot;文字色&quot;,
          backgroundColor: &quot;背景色&quot;,
          visible: &quot;显隐&quot;
        };
        const changes = [];
        ids.forEach((id) =&gt; {
          const previous = before.get(id);
          const next = after.get(id);
          if (!previous) {
            changes.push({ id, field: &quot;element&quot;, label: &quot;元素&quot;, before: &quot;不存在&quot;, after: &quot;新增&quot; });
            return;
          }
          if (!next) {
            changes.push({ id, field: &quot;element&quot;, label: &quot;元素&quot;, before: &quot;存在&quot;, after: &quot;已删除&quot; });
            return;
          }
          Object.keys(fieldLabels).forEach((field) =&gt; {
            const previousValue = field === &quot;xPercent&quot; || field === &quot;yPercent&quot; || field === &quot;widthPercent&quot; || field === &quot;heightPercent&quot;
              ? previous.layout?.[field]
              : previous[field];
            const nextValue = field === &quot;xPercent&quot; || field === &quot;yPercent&quot; || field === &quot;widthPercent&quot; || field === &quot;heightPercent&quot;
              ? next.layout?.[field]
              : next[field];
            if (normalizeDiffValue(previousValue) !== normalizeDiffValue(nextValue)) {
              changes.push({
                id,
                field,
                label: fieldLabels[field],
                before: previousValue,
                after: nextValue
              });
            }
          });
        });
        return changes;
      };

      const renderSnapshotDiff = (changes) =&gt; {
        if (!compareBaseline) {
          snapshotDiffOutput.hidden = true;
          snapshotDiffOutput.innerHTML = &quot;&quot;;
          return;
        }
        snapshotDiffOutput.hidden = false;
        snapshotDiffOutput.innerHTML = &quot;&quot;;
        if (compareBaseline.pageId !== activePageId) {
          const row = document.createElement(&quot;div&quot;);
          const mark = document.createElement(&quot;strong&quot;);
          mark.textContent = &quot;提示&quot;;
          const text = document.createElement(&quot;span&quot;);
          text.textContent = `基线来自“${getPageLabel(compareBaseline.pageId)}”，请切换到该页面后对比。`;
          row.append(mark, text);
          snapshotDiffOutput.appendChild(row);
          return;
        }
        if (!changes || changes.length === 0) {
          const row = document.createElement(&quot;div&quot;);
          const mark = document.createElement(&quot;strong&quot;);
          mark.textContent = &quot;一致&quot;;
          const text = document.createElement(&quot;span&quot;);
          text.textContent = &quot;当前页与基线一致。&quot;;
          row.append(mark, text);
          snapshotDiffOutput.appendChild(row);
          return;
        }
        changes.slice(0, 30).forEach((change) =&gt; {
          const row = document.createElement(&quot;div&quot;);
          const mark = document.createElement(&quot;strong&quot;);
          mark.textContent = change.id;
          const text = document.createElement(&quot;span&quot;);
          text.textContent = `${change.label}: ${String(change.before)} → ${String(change.after)}`;
          row.append(mark, text);
          snapshotDiffOutput.appendChild(row);
        });
      };

      const captureSnapshot = () =&gt; {
        syncActivePageState();
        compareBaseline = {
          pageId: activePageId,
          states: cloneStates(statesByPage.get(activePageId) || [])
        };
        renderSnapshotDiff([]);
        status.textContent = &quot;已保存对比基线&quot;;
        status.dataset.state = &quot;synced&quot;;
      };

      const compareSnapshot = () =&gt; {
        if (!compareBaseline) {
          status.textContent = &quot;请先保存对比基线&quot;;
          status.dataset.state = &quot;dirty&quot;;
          return;
        }
        if (compareBaseline.pageId !== activePageId) {
          renderSnapshotDiff(null);
          return;
        }
        syncActivePageState();
        const current = cloneStates(statesByPage.get(activePageId) || []);
        renderSnapshotDiff(diffStates(compareBaseline.states, current));
      };

      const clearSnapshot = () =&gt; {
        compareBaseline = null;
        renderSnapshotDiff(null);
        status.textContent = &quot;已清除对比基线&quot;;
        status.dataset.state = &quot;synced&quot;;
      };

      const renderMatrixDiff = (changesByPage) =&gt; {
        if (!matrixBaseline) {
          matrixDiffOutput.hidden = true;
          matrixDiffOutput.innerHTML = &quot;&quot;;
          return;
        }
        matrixDiffOutput.hidden = false;
        matrixDiffOutput.innerHTML = &quot;&quot;;
        const pageChanges = {};
        let totalChanges = 0;
        pageDefinitions.forEach((definition) =&gt; {
          const changes = changesByPage?.[definition.id] || [];
          pageChanges[definition.id] = changes;
          totalChanges += changes.length;
        });

        const grid = document.createElement(&quot;div&quot;);
        grid.className = &quot;nur-matrix-grid&quot;;
        pageDefinitions.forEach((definition) =&gt; {
          const changes = pageChanges[definition.id];
          const cell = document.createElement(&quot;button&quot;);
          cell.type = &quot;button&quot;;
          cell.className = &quot;nur-matrix-cell&quot;;
          cell.dataset.level = changes.length &gt; 0 ? &quot;changed&quot; : &quot;same&quot;;
          const label = document.createElement(&quot;span&quot;);
          label.textContent = definition.label;
          const count = document.createElement(&quot;small&quot;);
          count.textContent = changes.length &gt; 0 ? `${changes.length} 处差异` : &quot;无变化&quot;;
          cell.append(label, count);
          cell.addEventListener(&quot;click&quot;, () =&gt; renderPage(definition.id));
          grid.appendChild(cell);
        });
        matrixDiffOutput.appendChild(grid);

        const detailHeading = document.createElement(&quot;strong&quot;);
        detailHeading.textContent = &quot;差异明细&quot;;
        matrixDiffOutput.appendChild(detailHeading);

        if (totalChanges === 0) {
          const summary = document.createElement(&quot;div&quot;);
          summary.textContent = &quot;六页内容均与全站基线一致。&quot;;
          matrixDiffOutput.appendChild(summary);
          return;
        }

        pageDefinitions.forEach((definition) =&gt; {
          const changes = pageChanges[definition.id];
          if (changes.length === 0) return;
          const section = document.createElement(&quot;div&quot;);
          const heading = document.createElement(&quot;strong&quot;);
          heading.textContent = definition.label;
          section.appendChild(heading);
          changes.slice(0, 30).forEach((change) =&gt; {
            const row = document.createElement(&quot;div&quot;);
            const mark = document.createElement(&quot;strong&quot;);
            mark.textContent = change.id;
            const text = document.createElement(&quot;span&quot;);
            text.textContent = `${change.label}: ${String(change.before)} → ${String(change.after)}`;
            row.append(mark, text);
            section.appendChild(row);
          });
          matrixDiffOutput.appendChild(section);
        });
      };

      const captureMatrix = () =&gt; {
        syncActivePageState();
        matrixBaseline = snapshotAll();
        renderMatrixDiff({});
        status.textContent = &quot;已保存全站基线&quot;;
        status.dataset.state = &quot;synced&quot;;
      };

      const compareMatrix = () =&gt; {
        if (!matrixBaseline) {
          status.textContent = &quot;请先保存全站基线&quot;;
          status.dataset.state = &quot;dirty&quot;;
          return;
        }
        syncActivePageState();
        const currentAll = snapshotAll();
        const changesByPage = {};
        pageDefinitions.forEach((definition) =&gt; {
          changesByPage[definition.id] = diffStates(matrixBaseline[definition.id] || [], currentAll[definition.id] || []);
        });
        renderMatrixDiff(changesByPage);
        status.textContent = &quot;已生成跨页差异矩阵&quot;;
        status.dataset.state = &quot;synced&quot;;
      };

      const clearMatrix = () =&gt; {
        matrixBaseline = null;
        renderMatrixDiff(null);
        status.textContent = &quot;已清除全站基线&quot;;
        status.dataset.state = &quot;synced&quot;;
      };

      const addAnnotation = () =&gt; {
        const text = annotationInput.value.trim();
        if (!text) {
          status.textContent = &quot;批注内容为空&quot;;
          status.dataset.state = &quot;dirty&quot;;
          return;
        }
        annotations.unshift({
          id: `a${Date.now()}`,
          pageId: activePageId,
          reviewId: selected?.dataset.reviewId || null,
          text,
          createdAt: new Date().toISOString()
        });
        annotationInput.value = &quot;&quot;;
        renderAnnotationList();
        persistDraft();
        status.textContent = &quot;已添加批注&quot;;
        status.dataset.state = &quot;synced&quot;;
      };

      const renderArchiveList = () =&gt; {
        archiveList.innerHTML = &quot;&quot;;
        archiveVersions.forEach((version) =&gt; {
          const row = document.createElement(&quot;div&quot;);
          row.className = &quot;nur-archive-row&quot;;
          const time = document.createElement(&quot;time&quot;);
          time.textContent = new Date(version.createdAt).toLocaleString(&quot;zh-CN&quot;, { hour12: false });
          const restoreButton = document.createElement(&quot;button&quot;);
          restoreButton.type = &quot;button&quot;;
          restoreButton.className = &quot;nur-mini-button&quot;;
          restoreButton.textContent = &quot;恢复&quot;;
          restoreButton.addEventListener(&quot;click&quot;, () =&gt; {
            if (!version.draft) return;
            pushHistory();
            applyReviewData(version.draft);
            setDirty();
          });
          row.append(time, restoreButton);
          archiveList.appendChild(row);
        });
      };

      const archiveCurrent = () =&gt; {
        archiveVersions.unshift({
          id: `v${Date.now()}`,
          createdAt: new Date().toISOString(),
          draft: collectReviewData()
        });
        if (archiveVersions.length &gt; 20) archiveVersions.pop();
        renderArchiveList();
        persistDraft();
        status.textContent = &quot;已归档&quot;;
        status.dataset.state = &quot;synced&quot;;
      };

      const downloadJson = (payload, filename) =&gt; {
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: &quot;application/json&quot; });
        const url = URL.createObjectURL(blob);
        const link = document.createElement(&quot;a&quot;);
        link.href = url;
        link.download = filename;
        link.click();
        setTimeout(() =&gt; URL.revokeObjectURL(url), 1000);
      };

      const collectAIToUGUIBundle = () =&gt; {
        syncActivePageState();
        const buildNode = (pageId, descriptor) =&gt; {
          const entry = (statesByPage.get(pageId) || []).find((item) =&gt; item.id === descriptor.reviewId);
          const state = entry?.state || {
            style: descriptor.style || {},
            text: descriptor.text,
            textColor: descriptor.textColor || &quot;#ffffff&quot;,
            backgroundColor: descriptor.backgroundColor || &quot;#000000&quot;,
            uType: descriptor.uType,
            uName: descriptor.uName,
            visible: true,
            layout: {
              xPercent: Number.parseFloat(descriptor.style?.left),
              yPercent: Number.parseFloat(descriptor.style?.top),
              widthPercent: Number.parseFloat(descriptor.style?.width),
              heightPercent: Number.parseFloat(descriptor.style?.height)
            },
            fontSizePx: Number.parseFloat(descriptor.style?.fontSize) || null
          };
          const layout = state.layout || {};
          const styleString = [
            `left:${layout.xPercent ?? 0}%`,
            `top:${layout.yPercent ?? 0}%`,
            `width:${layout.widthPercent ?? 10}%`,
            `height:${layout.heightPercent ?? 10}%`
          ].join(&quot;;&quot;);
          const text = state.text === undefined ? null : state.text;
          return {
            name: state.uName || descriptor.uName || descriptor.reviewId,
            tag: descriptor.tag === &quot;img&quot; ? &quot;img&quot; : &quot;div&quot;,
            controlType: descriptor.uType || &quot;Div&quot;,
            role: descriptor.uType,
            elementId: descriptor.reviewId,
            attributes: [
              { name: &quot;data-u-name&quot;, value: state.uName || descriptor.uName || &quot;&quot; },
              { name: &quot;data-u-type&quot;, value: descriptor.uType || &quot;Div&quot; },
              { name: &quot;style&quot;, value: styleString }
            ],
            classes: descriptor.className ? [descriptor.className] : [],
            text,
            layout: {
              position: &quot;absolute&quot;,
              left: `${layout.xPercent ?? 0}%`,
              top: `${layout.yPercent ?? 0}%`,
              width: `${layout.widthPercent ?? 10}%`,
              height: `${layout.heightPercent ?? 10}%`
            },
            visual: {
              backgroundColor: state.backgroundColor || &quot;#000000&quot;,
              opacity: state.visible === false ? &quot;0&quot; : &quot;1&quot;
            },
            textStyle: {
              color: state.textColor || &quot;#ffffff&quot;,
              fontSize: state.fontSizePx ? `${state.fontSizePx}px` : null
            },
            children: (descriptor.children || []).map((child) =&gt; buildNode(pageId, child))
          };
        };

        return {
          schemaVersion: &quot;1.0&quot;,
          site: {
            siteId: &quot;neon-teahouse-ui&quot;,
            displayName: &quot;霓虹茶舍 UI&quot;,
            designWidth: 1920,
            designHeight: 1080
          },
          theme: {
            themeId: &quot;neon-teahouse-theme&quot;,
            displayName: &quot;霓虹茶舍主题&quot;,
            pageBackground: &quot;#0a1117&quot;,
            panelFill: &quot;#040d13&quot;,
            cardFill: &quot;#05141a&quot;,
            buttonFill: &quot;#2d0e22&quot;,
            accentColor: &quot;#79e6ef&quot;,
            textPrimary: &quot;#f0f7f8&quot;,
            textSecondary: &quot;#a7b0bd&quot;,
            outlineColor: &quot;rgba(121,230,239,0.58)&quot;,
            shadowColor: &quot;rgba(0,0,0,0.42)&quot;
          },
          pages: pageDefinitions.map((definition) =&gt; ({
            pageId: definition.id,
            runtimePageId: definition.id,
            displayName: definition.label,
            prefabName: definition.prefabName,
            targetLayer: &quot;Normal&quot;,
            logicalPath: `UI/Generated/neon-teahouse-ui/${definition.prefabName}`,
            root: {
              name: `${definition.id}Root`,
              tag: &quot;div&quot;,
              controlType: &quot;Div&quot;,
              role: &quot;page&quot;,
              attributes: [{ name: &quot;data-ui-page&quot;, value: definition.id }],
              classes: [&quot;nur-page-content&quot;],
              layout: {
                position: &quot;absolute&quot;,
                left: &quot;0%&quot;,
                top: &quot;0%&quot;,
                width: &quot;100%&quot;,
                height: &quot;100%&quot;
              },
              visual: { backgroundColor: &quot;#0a1117&quot;, opacity: &quot;1&quot; },
              textStyle: {},
              children: definition.elements.map((descriptor) =&gt; buildNode(definition.id, descriptor))
            }
          }))
        };
      };

      const parseStoryText = (code) =&gt; {
        try {
          const evaluate = new Function(&quot;window&quot;, `${code}\nreturn window.NeonTeahouseStory;`);
          return evaluate({}) || null;
        } catch {
          return null;
        }
      };

      const setElementText = (pageId, reviewId, text) =&gt; {
        const states = statesByPage.get(pageId);
        if (!states) return;
        const entry = states.find((item) =&gt; item.id === reviewId);
        if (!entry) return;
        entry.state.text = String(text ?? &quot;&quot;);
        if (pageId === activePageId) {
          const element = currentEditables.find((item) =&gt; item.dataset.reviewId === reviewId);
          const copy = element?.querySelector(&quot;[data-review-copy]&quot;);
          if (copy) copy.textContent = String(text ?? &quot;&quot;);
        }
      };

      const applyStorySeed = (story) =&gt; {
        if (!story || typeof story !== &quot;object&quot;) return false;
        const days = story.days || {};
        const dayKeys = Object.keys(days);
        const day = days[dayKeys[0]] || Object.values(days)[0] || null;
        const endings = story.endings || {};
        const ending = Object.values(endings)[0] || null;
        if (!day &amp;&amp; !ending) return false;

        const previewLines = day?.conversation?.previewLines || [];
        const choices = day?.conversation?.choices || [];
        const introLines = day?.introLines || [];
        const teaProfile = day?.teaProfile || {};
        const ideal = teaProfile.ideal || {};
        const gate = day?.gate || {};
        const backroom = day?.backroom || {};
        const dayNumber = dayKeys[0] || String(day?.id || &quot;1&quot;);

        setElementText(&quot;01-dialogue-panel&quot;, &quot;sceneDayLabel&quot;, day?.title || &quot;DAY 1 · 慈恩寺异稿&quot;);
        setElementText(&quot;01-dialogue-panel&quot;, &quot;speakerName&quot;, previewLines[0]?.speaker || introLines[introLines.length - 1]?.speaker || &quot;椎名立希&quot;);
        setElementText(&quot;01-dialogue-panel&quot;, &quot;dialogueContent&quot;, day?.conversation?.prompt || previewLines[0]?.text || day?.description || &quot;如果两份记忆都足够诚实，为什么系统只允许留下一份？&quot;);
        setElementText(&quot;01-dialogue-panel&quot;, &quot;dialogueChoiceA&quot;, choices[0]?.label || &quot;先保留差异，再追问来源&quot;);
        setElementText(&quot;01-dialogue-panel&quot;, &quot;dialogueChoiceB&quot;, choices[1]?.label || &quot;先选择可信的一份记录&quot;);

        setElementText(&quot;02-mixing-panel&quot;, &quot;mixingTitle&quot;, `${day?.title || &quot;第一夜&quot;} · 茶饮调制`);
        setElementText(&quot;02-mixing-panel&quot;, &quot;mixingHint&quot;, teaProfile.hint || &quot;她需要温暖与安静，但太强的旧香会让别人的人生盖过她。&quot;);
        setElementText(&quot;02-mixing-panel&quot;, &quot;mixingRecipeA&quot;, ideal.base ? `茶底：${ideal.base}` : &quot;茶底：白茶&quot;);
        setElementText(&quot;02-mixing-panel&quot;, &quot;mixingRecipeB&quot;, ideal.addon ? `辅料：${ideal.addon}` : &quot;辅料：桂花&quot;);
        setElementText(&quot;02-mixing-panel&quot;, &quot;mixingRecipeC&quot;, Array.isArray(ideal.temperature) ? `水温：${ideal.temperature[0]}-${ideal.temperature[1]}℃` : &quot;水温：70-82℃&quot;);
        setElementText(&quot;02-mixing-panel&quot;, &quot;mixingRecipeD&quot;, Array.isArray(ideal.steep) ? `冲泡：${ideal.steep[0]}-${ideal.steep[1]}s` : &quot;冲泡：30-55s&quot;);

        setElementText(&quot;03-hud&quot;, &quot;hudDayValue&quot;, String(dayNumber).replace(&quot;day&quot;, &quot;&quot;));
        setElementText(&quot;03-hud&quot;, &quot;hudTimeValue&quot;, day?.clock || &quot;OPEN 19:40&quot;);
        setElementText(&quot;03-hud&quot;, &quot;hudWeatherIcon&quot;, String(day?.art?.backgroundAlt || &quot;&quot;).includes(&quot;雨&quot;) ? &quot;雨夜&quot; : &quot;长安&quot;);

        setElementText(&quot;04-announcement&quot;, &quot;announcementTitle&quot;, gate.title || day?.title || &quot;第一夜 · 慈恩寺的异稿&quot;);
        setElementText(&quot;04-announcement&quot;, &quot;announcementDate&quot;, day?.clock || &quot;OPEN 19:40&quot;);
        setElementText(&quot;04-announcement&quot;, &quot;announcementBody&quot;, gate.description || day?.description || &quot;旧灯第一次正式营业。&quot;);

        setElementText(&quot;05-backlog&quot;, &quot;backlogTitle&quot;, backroom.recapTitle || gate.title || &quot;慈恩寺的异稿&quot;);
        setElementText(&quot;05-backlog&quot;, &quot;backlogLine1&quot;, backroom.recap || day?.description || &quot;慈恩寺塔唱和留下不同而诚实的记载。&quot;);
        setElementText(&quot;05-backlog&quot;, &quot;backlogLine2&quot;, day?.observation?.text || day?.description || &quot;长崎素世认出千早爱音原始手账的针脚。&quot;);
        setElementText(&quot;05-backlog&quot;, &quot;backlogLine3&quot;, backroom.clue || day?.clue || &quot;异稿、旧纸针脚，以及第一次被说出的“千早爱音”。&quot;);

        if (ending) {
          setElementText(&quot;06-ending&quot;, &quot;endingLabel&quot;, ending.label || &quot;ENDING A / 留灯&quot;);
          setElementText(&quot;06-ending&quot;, &quot;endingTitle&quot;, ending.title || &quot;沿着灯继续寻找&quot;);
          setElementText(&quot;06-ending&quot;, &quot;endingText&quot;, ending.text || &quot;椎名立希没有找到千早爱音，也没有把裂隙中的未知写成幸存证明。&quot;);
          setElementText(&quot;06-ending&quot;, &quot;endingQuote&quot;, ending.quote || &quot;我寻找的不是过去替我留下的答案，而是她仍可能拥有的选择。&quot;);
        }
        renderInspector();
        return true;
      };

      const parseCssDeclarations = (styleText) =&gt; {
        const declarations = {};
        String(styleText || &quot;&quot;).split(&quot;;&quot;).forEach((part) =&gt; {
          const separatorIndex = part.indexOf(&quot;:&quot;);
          if (separatorIndex &lt;= 0) return;
          const property = part.slice(0, separatorIndex).trim();
          const value = part.slice(separatorIndex + 1).trim();
          if (property &amp;&amp; value) declarations[property] = value;
        });
        return declarations;
      };

      const styleValueToPercent = (value, designSize, fallback) =&gt; {
        if (value === undefined || value === null || value === &quot;&quot;) return fallback;
        const number = Number.parseFloat(value);
        if (!Number.isFinite(number)) return fallback;
        if (String(value).trim().endsWith(&quot;%&quot;)) return number;
        return Math.max(0, Math.min(100, (number / designSize) * 100));
      };

      const descriptorClassByType = (uType) =&gt; {
        if (uType === &quot;button&quot;) return &quot;nur-choice&quot;;
        if (uType === &quot;image&quot;) return &quot;nur-character&quot;;
        if (uType === &quot;div&quot; || uType === &quot;scroll&quot;) return &quot;nur-dialogue-panel&quot;;
        return &quot;nur-body-copy&quot;;
      };

      const convertHtmlElementToDescriptor = (element, designSize, usedIds) =&gt; {
        const uType = element.getAttribute(&quot;data-u-type&quot;) || &quot;div&quot;;
        const uName = element.getAttribute(&quot;data-u-name&quot;) || `element${usedIds.size + 1}`;
        const baseId = element.getAttribute(&quot;data-review-id&quot;) || `html-${uName}`;
        let reviewId = baseId;
        let suffix = 1;
        while (usedIds.has(reviewId)) {
          suffix += 1;
          reviewId = `${baseId}-${suffix}`;
        }
        usedIds.add(reviewId);

        const declarations = parseCssDeclarations(element.getAttribute(&quot;style&quot;));
        const left = styleValueToPercent(declarations.left, designSize.width, 0);
        const top = styleValueToPercent(declarations.top, designSize.height, 0);
        const width = styleValueToPercent(declarations.width, designSize.width, 10);
        const height = styleValueToPercent(declarations.height, designSize.height, 10);
        const fontSize = Number.parseFloat(declarations[&quot;font-size&quot;]);
        const isText = uType === &quot;text&quot; || uType === &quot;button&quot;;
        const text = isText ? element.textContent.trim() : null;
        const children = Array.from(element.children)
          .filter((child) =&gt; child.hasAttribute(&quot;data-u-type&quot;))
          .map((child) =&gt; convertHtmlElementToDescriptor(child, designSize, usedIds));

        return {
          reviewId,
          uType,
          uName,
          className: descriptorClassByType(uType),
          tag: uType === &quot;image&quot; ? &quot;img&quot; : &quot;div&quot;,
          text,
          textColor: declarations.color || &quot;#f0f7f8&quot;,
          backgroundColor: declarations[&quot;background-color&quot;] || &quot;#040d13&quot;,
          style: {
            left: `${left}%`,
            top: `${top}%`,
            width: `${width}%`,
            height: `${height}%`,
            fontSize: Number.isFinite(fontSize) ? `${Math.max(6, Math.min(72, fontSize))}px` : &quot;12px&quot;
          },
          src: element.getAttribute(&quot;src&quot;) || null,
          alt: element.getAttribute(&quot;alt&quot;) || &quot;&quot;,
          children
        };
      };

      const firstLeafReviewId = (descriptors) =&gt; {
        for (const descriptor of descriptors) {
          if (descriptor.text !== null &amp;&amp; descriptor.text !== undefined) return descriptor.reviewId;
          const childId = firstLeafReviewId(descriptor.children || []);
          if (childId) return childId;
        }
        return descriptors[0]?.reviewId || null;
      };

      const importHtmlSliceText = (text) =&gt; {
        const doc = new DOMParser().parseFromString(text, &quot;text/html&quot;);
        const designSize = { width: 1920, height: 1080 };
        const allCandidates = Array.from(doc.querySelectorAll(&quot;[data-u-type][data-u-name]&quot;));
        if (allCandidates.length === 0) return null;
        const topLevel = allCandidates.filter((element) =&gt; !element.parentElement?.closest(&quot;[data-u-type]&quot;));
        const roots = topLevel.length &gt; 0 ? topLevel : allCandidates;
        const usedIds = new Set();
        const elements = roots.map((element) =&gt; convertHtmlElementToDescriptor(element, designSize, usedIds));
        if (elements.length === 0) return null;

        const pageId = `html-slice-${Date.now()}`;
        const definition = {
          id: pageId,
          label: &quot;HTML 切片&quot;,
          title: &quot;HTML 切片审核&quot;,
          defaultReviewId: firstLeafReviewId(elements),
          prefabName: &quot;HtmlSlicePanel&quot;,
          elements
        };
        pageDefinitions.push(definition);

        const container = document.createElement(&quot;div&quot;);
        container.dataset.page = pageId;
        container.hidden = true;
        elements.forEach((descriptor) =&gt; container.appendChild(createPageElement(descriptor)));
        canvas.appendChild(container);
        pageContainers.set(pageId, container);

        const defaults = snapshotElements(getPageElements(pageId));
        defaultsByPage.set(pageId, defaults);
        statesByPage.set(pageId, cloneStates(defaults));
        renderPage(pageId);
        renderValidation();
        setDirty();
        return pageId;
      };

      snapshotCaptureButton.addEventListener(&quot;click&quot;, captureSnapshot);
      snapshotCompareButton.addEventListener(&quot;click&quot;, compareSnapshot);
      snapshotClearButton.addEventListener(&quot;click&quot;, clearSnapshot);
      matrixCaptureButton.addEventListener(&quot;click&quot;, captureMatrix);
      matrixCompareButton.addEventListener(&quot;click&quot;, compareMatrix);
      matrixClearButton.addEventListener(&quot;click&quot;, clearMatrix);
      addAnnotationButton.addEventListener(&quot;click&quot;, addAnnotation);
      annotationInput.addEventListener(&quot;keydown&quot;, (event) =&gt; {
        if (event.key === &quot;Enter&quot;) addAnnotation();
      });
      validateButton.addEventListener(&quot;click&quot;, renderValidation);
      archiveButton.addEventListener(&quot;click&quot;, archiveCurrent);
      archiveCurrentButton.addEventListener(&quot;click&quot;, archiveCurrent);
      exportButton.addEventListener(&quot;click&quot;, () =&gt; {
        downloadJson(collectReviewData(), `neon-teahouse-ui-review-${new Date().toISOString().slice(0, 10)}.json`);
        status.textContent = &quot;已导出 JSON&quot;;
        status.dataset.state = &quot;synced&quot;;
      });
      exportAIToUGUIButton.addEventListener(&quot;click&quot;, () =&gt; {
        downloadJson(collectAIToUGUIBundle(), `neon-teahouse-aitougui-${new Date().toISOString().slice(0, 10)}.json`);
        status.textContent = &quot;已导出 AIToUGUI&quot;;
        status.dataset.state = &quot;synced&quot;;
      });
      loadStoryButton.addEventListener(&quot;click&quot;, () =&gt; storyFile.click());
      importHtmlSliceButton.addEventListener(&quot;click&quot;, () =&gt; htmlSliceFile.click());
      htmlSliceFile.addEventListener(&quot;change&quot;, async () =&gt; {
        const file = htmlSliceFile.files &amp;&amp; htmlSliceFile.files[0];
        if (!file) return;
        try {
          const pageId = importHtmlSliceText(await file.text());
          if (!pageId) throw new Error(&quot;html slice parse failed&quot;);
          pushHistory();
          status.textContent = &quot;已导入 HTML 切片&quot;;
          status.dataset.state = &quot;dirty&quot;;
        } catch {
          status.textContent = &quot;HTML 切片解析失败&quot;;
          status.dataset.state = &quot;dirty&quot;;
        } finally {
          htmlSliceFile.value = &quot;&quot;;
        }
      });
      storyFile.addEventListener(&quot;change&quot;, async () =&gt; {
        const file = storyFile.files &amp;&amp; storyFile.files[0];
        if (!file) return;
        try {
          const story = parseStoryText(await file.text());
          if (!story) throw new Error(&quot;story.js parse failed&quot;);
          pushHistory();
          applyStorySeed(story);
          renderValidation();
          setDirty();
          status.textContent = &quot;已从 story.js 生成&quot;;
          status.dataset.state = &quot;dirty&quot;;
        } catch {
          status.textContent = &quot;story.js 解析失败&quot;;
          status.dataset.state = &quot;dirty&quot;;
        } finally {
          storyFile.value = &quot;&quot;;
        }
      });
      importButton.addEventListener(&quot;click&quot;, () =&gt; importFile.click());
      importFile.addEventListener(&quot;change&quot;, async () =&gt; {
        const file = importFile.files &amp;&amp; importFile.files[0];
        if (!file) return;
        try {
          const payload = JSON.parse(await file.text());
          pushHistory();
          applyReviewData(payload);
          renderValidation();
          setDirty();
        } catch {
          status.textContent = &quot;导入失败&quot;;
          status.dataset.state = &quot;dirty&quot;;
        } finally {
          importFile.value = &quot;&quot;;
        }
      });

      syncButton.addEventListener(&quot;click&quot;, async () =&gt; {
        const payload = collectReviewData();
        syncButton.disabled = true;
        syncButton.querySelector(&quot;span&quot;).textContent = &quot;同步中&quot;;
        try {
          if (window.openai &amp;&amp; typeof window.openai.sendFollowUpMessage === &quot;function&quot;) {
            await window.openai.sendFollowUpMessage({
              title: &quot;同步 UI 审核草稿&quot;,
              prompt: [
                &quot;请接收下面的 UI 审核草稿数据。先不要判定通过，等待我在对话中明确说“通过”。&quot;,
                &quot;&quot;,
                JSON.stringify(payload, null, 2)
              ].join(String.fromCharCode(10))
            });
          } else {
            downloadJson(payload, `neon-teahouse-ui-review-${new Date().toISOString().slice(0, 10)}.json`);
          }
          status.textContent = &quot;已同步&quot;;
          status.dataset.state = &quot;synced&quot;;
        } finally {
          syncButton.disabled = false;
          syncButton.querySelector(&quot;span&quot;).textContent = &quot;同步草稿&quot;;
        }
      });

      buildPageContainers();
      pageContainers.forEach((container, pageId) =&gt; {
        const defaults = snapshotElements(getPageElements(pageId));
        defaultsByPage.set(pageId, defaults);
        statesByPage.set(pageId, cloneStates(defaults));
      });
      renderPage(activePageId);

      const persisted = loadPersisted();
      if (persisted) {
        archiveVersions = Array.isArray(persisted.archives) ? persisted.archives : [];
        if (persisted.draft) applyReviewData(persisted.draft);
        if (Array.isArray(persisted.annotations)) {
          annotations = persisted.annotations
            .filter((annotation) =&gt; annotation &amp;&amp; typeof annotation.id === &quot;string&quot; &amp;&amp; typeof annotation.text === &quot;string&quot;)
            .map((annotation) =&gt; ({ ...annotation }));
        }
        renderArchiveList();
        renderAnnotationList();
        status.textContent = &quot;已加载本地草稿&quot;;
        status.dataset.state = &quot;dirty&quot;;
      }
      renderValidation();
      updateHistoryButtons();
    })();
  &lt;/script&gt;
&lt;/div&gt;
"></iframe>
</body>
</html>
