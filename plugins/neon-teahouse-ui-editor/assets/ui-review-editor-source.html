      const snapshot = (element) => {
        const copy = element.querySelector("[data-review-copy]");
        return {
          style: element.getAttribute("style") || "",
          text: copy ? copy.textContent : null,
          textColor: element.dataset.textColor || "#ffffff",
          backgroundColor: element.dataset.backgroundColor || "#000000",
          uType: element.dataset.uType,
          uName: element.dataset.uName,
          visible: element.style.visibility !== "hidden",
          layout: {
            xPercent: Number.parseFloat(element.style.left),
            yPercent: Number.parseFloat(element.style.top),
            widthPercent: Number.parseFloat(element.style.width),
            heightPercent: Number.parseFloat(element.style.height)
          },
          fontSizePx: copy ? Number.parseFloat(element.style.fontSize) : null
        };
      };

      const cloneState = (state) => ({
        ...state,
        layout: { ...(state.layout || {}) }
      });

      const snapshotElements = (elements) => elements.map((element) => ({
        id: element.dataset.reviewId,
        state: snapshot(element)
      }));

      const cloneStates = (states) => states.map((entry) => ({
        id: entry.id,
        state: cloneState(entry.state)
      }));

      const getPageDefinition = (pageId) => pageDefinitions.find((item) => item.id === pageId);

      const getPageElements = (pageId) => {
        const container = pageContainers.get(pageId);
        return container ? Array.from(container.querySelectorAll(".nur-editable[data-review-id]")) : [];
      };

      const createPageElement = (descriptor) => {
        const tag = descriptor.tag || "div";
        const element = document.createElement(tag);
        element.className = `nur-editable ${descriptor.className || ""}`.trim();
        element.dataset.reviewId = descriptor.reviewId;
        element.dataset.uType = descriptor.uType;
        element.dataset.uName = descriptor.uName;
        element.dataset.textColor = descriptor.textColor || "#ffffff";
        element.dataset.backgroundColor = descriptor.backgroundColor || "#000000";
        Object.entries(descriptor.style || {}).forEach(([property, value]) => {
          element.style[property] = value;
        });
        if (tag === "img") {
          if (descriptor.src) element.src = descriptor.src;
          if (descriptor.alt) element.alt = descriptor.alt;
        } else if (descriptor.text !== null && descriptor.text !== undefined) {
          const copy = document.createElement("span");
          copy.dataset.reviewCopy = "";
          copy.textContent = descriptor.text;
          element.appendChild(copy);
        }
        (descriptor.children || []).forEach((child) => {
          element.appendChild(createPageElement(child));
        });
        return element;
      };

      const buildPageContainers = () => {
        const dialogueContainer = document.createElement("div");
        dialogueContainer.dataset.page = "01-dialogue-panel";
        Array.from(canvas.querySelectorAll(":scope > .nur-editable[data-review-id]")).forEach((element) => {
          dialogueContainer.appendChild(element);
        });
        canvas.appendChild(dialogueContainer);
        pageContainers.set("01-dialogue-panel", dialogueContainer);

        pageDefinitions.forEach((definition) => {
          if (definition.id === "01-dialogue-panel") return;
          const container = document.createElement("div");
          container.dataset.page = definition.id;
          container.hidden = true;
          definition.elements.forEach((descriptor) => {
            container.appendChild(createPageElement(descriptor));
          });
          canvas.appendChild(container);
          pageContainers.set(definition.id, container);
        });
      };

      const syncActivePageState = () => {
        if (!activePageId || !pageContainers.has(activePageId)) return;
        statesByPage.set(activePageId, snapshotElements(getPageElements(activePageId)));
      };

      const snapshotAll = () => {
        syncActivePageState();
        const result = {};
        pageContainers.forEach((container, pageId) => {
          result[pageId] = cloneStates(statesByPage.get(pageId) || []);
        });
        return result;
      };

      const applyElementStates = (elements, states) => {
        const byId = new Map(elements.map((element) => [element.dataset.reviewId, element]));
        states.forEach(({ id, state }) => {
          const element = byId.get(id);
          if (element) restore(element, state);
        });
      };

      const restoreAll = (snapshot) => {
        Object.entries(snapshot || {}).forEach(([pageId, states]) => {
          if (!pageContainers.has(pageId)) return;
          statesByPage.set(pageId, cloneStates(states));
        });
        const restoredStates = statesByPage.get(activePageId) || [];
        applyElementStates(currentEditables, restoredStates);
        currentEditables.forEach(applyColors);
        renderInspector();
        updateHistoryButtons();
      };

      const updatePageTabs = () => {
        if (!pageTabs) return;
        pageTabs.innerHTML = "";
        pageDefinitions.forEach((definition) => {
          const button = document.createElement("button");
          button.type = "button";
          button.className = "nur-page-tab";
          button.textContent = definition.label;
          button.setAttribute("aria-selected", definition.id === activePageId ? "true" : "false");
          button.addEventListener("click", () => renderPage(definition.id));
          pageTabs.appendChild(button);
        });
      };

      const updateStageMeta = () => {
        const definition = getPageDefinition(activePageId);
        if (!definition) return;
        if (brandSubtitle) brandSubtitle.textContent = `${definition.id} · 1920 × 1080`;
        if (stageTitle) stageTitle.textContent = definition.title;
        canvas.setAttribute("aria-label", `可编辑的霓虹茶舍${definition.label}页面切片`);
      };

      const renderPage = (pageId) => {
        const definition = getPageDefinition(pageId);
        if (!definition) return;
        syncActivePageState();
        activePageId = pageId;
        pageContainers.forEach((container, id) => {
          container.hidden = id !== pageId;
        });
        currentEditables = getPageElements(pageId);
        if (!statesByPage.has(pageId)) {
          statesByPage.set(pageId, cloneStates(defaultsByPage.get(pageId) || []));
        }
        applyElementStates(currentEditables, statesByPage.get(pageId));
        currentEditables.forEach(applyColors);
        updatePageTabs();
        updateStageMeta();
        renderSnapshotDiff(null);
        const defaultElement = currentEditables.find((element) => element.dataset.reviewId === definition.defaultReviewId) || currentEditables[0];
        if (defaultElement) selectElement(defaultElement);
        renderInspector();
      };

      const pushHistory = () => {
        undoStack.push(snapshotAll());
        if (undoStack.length > 50) undoStack.shift();
        redoStack = [];
        updateHistoryButtons();
      };

      const updateHistoryButtons = () => {
        undoButton.disabled = undoStack.length === 0;
        redoButton.disabled = redoStack.length === 0;
      };

      const persistDraft = () => {
        try {
          localStorage.setItem(storageKey, JSON.stringify({
            draft: collectReviewData(),
            archives: archiveVersions,
            annotations: annotations
          }));
        } catch {
          // The editor still works without storage in restricted contexts.
        }
      };

      const loadPersisted = () => {
        try {
          const raw = localStorage.getItem(storageKey);
          return raw ? JSON.parse(raw) : null;
        } catch {
          return null;
        }
      };

      const numberFromStyle = (element, property, fallback) => {
        const value = Number.parseFloat(element.style[property]);
        return Number.isFinite(value) ? value : fallback;
      };

      const setDirty = () => {
        status.textContent = "未同步";
        status.dataset.state = "dirty";
        persistDraft();
      };

      const applyColors = (element) => {
        if (element.matches("img")) return;
        element.style.color = element.dataset.textColor;
        element.style.backgroundColor = element.dataset.backgroundColor;
      };

      const renderInspector = () => {
        if (!selected) return;
        const copy = selected.querySelector("[data-review-copy]");
        const hasText = Boolean(copy);
        selectedId.textContent = selected.dataset.reviewId;
        stageNote.textContent = selected.dataset.uName;
        textValue.disabled = !hasText;
        textValue.value = hasText ? copy.textContent : "";
        textValue.placeholder = hasText ? "" : "该控件没有可编辑文案";
        posX.value = numberFromStyle(selected, "left", 0);
        posY.value = numberFromStyle(selected, "top", 0);
        sizeW.value = numberFromStyle(selected, "width", 10);
        sizeH.value = numberFromStyle(selected, "height", 10);
        fontSize.disabled = !hasText;
        fontSize.value = hasText ? String(numberFromStyle(selected, "fontSize", 14)) : "";
        textColor.disabled = !hasText;
        textColor.value = selected.dataset.textColor || "#ffffff";
        backgroundColor.disabled = selected.matches("img");
        backgroundColor.value = selected.dataset.backgroundColor || "#000000";
        textColorCode.textContent = textColor.value;
        backgroundColorCode.textContent = backgroundColor.value;
        visible.checked = selected.style.visibility !== "hidden";
        uType.textContent = selected.dataset.uType;
        uName.textContent = selected.dataset.uName;
      };

      const selectElement = (element) => {
        currentEditables.forEach((item) => { item.dataset.selected = "false"; });
        selected = element;
        selected.dataset.selected = "true";
        renderInspector();
        updateAnnotationTarget();
      };

      const restore = (element, state) => {
        element.setAttribute("style", state.style);
        element.dataset.textColor = state.textColor;
        element.dataset.backgroundColor = state.backgroundColor;
        element.style.visibility = state.visible ? "visible" : "hidden";
        const copy = element.querySelector("[data-review-copy]");
        if (copy && state.text !== null) copy.textContent = state.text;
        applyColors(element);
      };

      canvas.addEventListener("click", (event) => {
        const target = event.target.closest(".nur-editable[data-review-id]");
        if (target && pageContainers.get(activePageId)?.contains(target)) {
          event.preventDefault();
          selectElement(target);
          return;
        }
        if (selected) selectElement(selected);
      });

      textValue.addEventListener("input", () => {
        if (!selected) return;
        const copy = selected.querySelector("[data-review-copy]");
        if (!copy) return;
        pushHistory();
        copy.textContent = textValue.value;
        setDirty();
      });

      const bindPercent = (input, property) => {
        input.addEventListener("input", () => {
          if (!selected) return;
          const value = Number.parseFloat(input.value);
          if (!Number.isFinite(value)) return;
          pushHistory();
          selected.style[property] = `${value}%`;
          setDirty();
        });
      };

      bindPercent(posX, "left");
      bindPercent(posY, "top");
      bindPercent(sizeW, "width");
      bindPercent(sizeH, "height");

      fontSize.addEventListener("input", () => {
        if (!selected || fontSize.disabled) return;
        const value = Number.parseFloat(fontSize.value);
        if (!Number.isFinite(value)) return;
        pushHistory();
        selected.style.fontSize = `${Math.max(6, Math.min(72, value))}px`;
        setDirty();
      });

      textColor.addEventListener("input", () => {
        if (!selected || textColor.disabled) return;
        pushHistory();
        selected.dataset.textColor = textColor.value;
        textColorCode.textContent = textColor.value;
        applyColors(selected);
        setDirty();
      });

      backgroundColor.addEventListener("input", () => {
        if (!selected || backgroundColor.disabled) return;
        pushHistory();
        selected.dataset.backgroundColor = backgroundColor.value;
        backgroundColorCode.textContent = backgroundColor.value;
        applyColors(selected);
        setDirty();
      });

      visible.addEventListener("change", () => {
        if (!selected) return;
        pushHistory();
        selected.style.visibility = visible.checked ? "visible" : "hidden";
        setDirty();
      });

      resetSelectedButton.addEventListener("click", () => {
        if (!selected) return;
        pushHistory();
        const defaultEntry = (defaultsByPage.get(activePageId) || []).find((entry) => entry.id === selected.dataset.reviewId);
        if (defaultEntry) restore(selected, defaultEntry.state);
        syncActivePageState();
        renderInspector();
        setDirty();
      });

      resetAllButton.addEventListener("click", () => {
        pushHistory();
        const defaultStates = defaultsByPage.get(activePageId) || [];
        currentEditables.forEach((element) => {
          const defaultEntry = defaultStates.find((entry) => entry.id === element.dataset.reviewId);
          if (defaultEntry) restore(element, defaultEntry.state);
        });
        syncActivePageState();
        renderInspector();
        setDirty();
      });

      undoButton.addEventListener("click", () => {
        if (undoStack.length === 0) return;
        redoStack.push(snapshotAll());
        restoreAll(undoStack.pop());
        updateHistoryButtons();
        setDirty();
      });

      redoButton.addEventListener("click", () => {
        if (redoStack.length === 0) return;
        undoStack.push(snapshotAll());
        restoreAll(redoStack.pop());
        updateHistoryButtons();
        setDirty();
      });

      focusSelectedButton.addEventListener("click", () => {
        if (!selected) return;
        selected.animate(
          [
            { boxShadow: "0 0 0 5px rgba(121, 230, 239, 0.13)" },
            { boxShadow: "0 0 0 10px rgba(121, 230, 239, 0.28)" },
            { boxShadow: "0 0 0 5px rgba(121, 230, 239, 0.13)" }
          ],
          { duration: 420, easing: "ease-out" }
        );
      });

      const stateToReviewItem = (entry) => {
        const state = entry.state;
        const layout = state.layout || {};
        return {
          id: entry.id,
          uType: state.uType || "div",
          uName: state.uName || entry.id,
          text: state.text === undefined ? null : state.text,
          layout: {
            xPercent: layout.xPercent,
            yPercent: layout.yPercent,
            widthPercent: layout.widthPercent,
            heightPercent: layout.heightPercent
          },
          style: {
            fontSizePx: state.fontSizePx,
            textColor: state.textColor,
            backgroundColor: state.backgroundColor
          },
          visible: state.visible !== false
        };
      };

      const collectReviewData = () => {
        syncActivePageState();
        return {
          schema: "neon-teahouse-ui-review/v2",
          referenceResolution: { width: 1920, height: 1080 },
          pages: pageDefinitions.map((definition) => ({
            pageId: definition.id,
            label: definition.label,
            elements: (statesByPage.get(definition.id) || []).map(stateToReviewItem)
          })),
          annotations: annotations.map((annotation) => ({ ...annotation }))
        };
      };

      const itemToElementState = (item) => {
        const layout = item.layout || {};
        const style = item.style || {};
        const state = {
          style: "",
          text: typeof item.text === "string" ? item.text : null,
          textColor: typeof style.textColor === "string" ? style.textColor : "#ffffff",
          backgroundColor: typeof style.backgroundColor === "string" ? style.backgroundColor : "#000000",
          uType: item.uType || "div",
          uName: item.uName || item.id,
          visible: item.visible !== false,
          layout: {
            xPercent: typeof layout.xPercent === "number" ? layout.xPercent : 0,
            yPercent: typeof layout.yPercent === "number" ? layout.yPercent : 0,
            widthPercent: typeof layout.widthPercent === "number" ? layout.widthPercent : 10,
            heightPercent: typeof layout.heightPercent === "number" ? layout.heightPercent : 10
          },
          fontSizePx: typeof style.fontSizePx === "number" ? style.fontSizePx : null
        };
        state.style = `left:${state.layout.xPercent}%;top:${state.layout.yPercent}%;width:${state.layout.widthPercent}%;height:${state.layout.heightPercent}%;`;
        if (state.fontSizePx !== null) state.style += `font-size:${state.fontSizePx}px;`;
        return state;
      };

      const normalizeReviewPages = (payload) => {
        if (!payload) return [];
        if (Array.isArray(payload.pages)) {
          return payload.pages.filter((page) => page && Array.isArray(page.elements)).map((page) => ({
            pageId: page.pageId,
            label: page.label || page.pageId,
            elements: page.elements
          }));
        }
        if (Array.isArray(payload.elements)) {
          return [{
            pageId: payload.pageId || activePageId,
            label: payload.pageId || activePageId,
            elements: payload.elements
          }];
        }
        return [];
      };

      const applyReviewData = (payload) => {
        const pages = normalizeReviewPages(payload);
        if (pages.length === 0) return false;
        pages.forEach((page) => {
          if (!pageContainers.has(page.pageId)) return;
          const elements = getPageElements(page.pageId);
          const byId = new Map(elements.map((element) => [element.dataset.reviewId, element]));
          const nextStates = page.elements.map((item) => {
            const element = byId.get(item.id);
            if (!element) return null;
            const state = itemToElementState(item);
            restore(element, state);
            return { id: item.id, state };
          }).filter(Boolean);
          statesByPage.set(page.pageId, nextStates);
        });
        if (Array.isArray(payload.annotations)) {
          annotations = payload.annotations
            .filter((annotation) => annotation && typeof annotation.id === "string" && typeof annotation.text === "string")
            .map((annotation) => ({ ...annotation }));
        }
        if (activePageId && pageContainers.has(activePageId)) {
          renderPage(activePageId);
        }
        renderAnnotationList();
        renderInspector();
        return true;
      };

      const validateReviewData = (payload) => {
        const issues = [];
        const pages = normalizeReviewPages(payload);
        pages.forEach((page) => {
          const ids = new Set();
          page.elements.forEach((item, index) => {
            const label = `${page.pageId}:${item.id || `elements[${index}]`}`;
            if (!item.id) issues.push(`${label}: 缺少 id`);
            else if (ids.has(item.id)) issues.push(`${label}: 重复 id`);
            else ids.add(item.id);
            if (!item.uName) issues.push(`${label}: 缺少 uName`);
            const layout = item.layout || {};
            const percentages = [layout.xPercent, layout.yPercent, layout.widthPercent, layout.heightPercent];
            if (percentages.some((value) => typeof value !== "number" || !Number.isFinite(value) || value < 0 || value > 100)) {
              issues.push(`${label}: 布局百分比越界`);
            }
            if ((item.uType === "text" || item.uType === "button") && typeof item.text === "string" && !item.text.trim()) {
              issues.push(`${label}: 文案为空`);
            }
          });
        });
        return issues;
      };

      const renderValidation = () => {
        const issues = validateReviewData(collectReviewData());
        validationSummary.textContent = issues.length === 0 ? "校验通过" : `${issues.length} 个问题`;
        validationSummary.dataset.state = issues.length === 0 ? "ok" : "error";
        validationOutput.hidden = issues.length === 0;
        validationOutput.innerHTML = "";
        issues.slice(0, 8).forEach((issue) => {
          const row = document.createElement("div");
          const mark = document.createElement("strong");
          mark.textContent = "待修";
          const text = document.createElement("span");
          text.textContent = issue;
          row.append(mark, text);
          validationOutput.appendChild(row);
        });
      };

      const getPageLabel = (pageId) => getPageDefinition(pageId)?.label || pageId;

      const updateAnnotationTarget = () => {
        if (!annotationTarget) return;
        const pageLabel = getPageLabel(activePageId);
        annotationTarget.textContent = selected ? `${pageLabel} · ${selected.dataset.uName}` : pageLabel;
      };

      const renderAnnotationList = () => {
        annotationList.innerHTML = "";
        if (annotations.length === 0) {
          const empty = document.createElement("div");
          empty.className = "nur-archive-row";
          empty.textContent = "暂无批注";
          annotationList.appendChild(empty);
          return;
        }
        annotations.forEach((annotation) => {
          const row = document.createElement("div");
          row.className = "nur-archive-row";
          const content = document.createElement("span");
          const target = annotation.reviewId || "当前页";
          content.textContent = `${getPageLabel(annotation.pageId)} · ${target}: ${annotation.text}`;
          const deleteButton = document.createElement("button");
          deleteButton.type = "button";
          deleteButton.className = "nur-mini-button";
          deleteButton.textContent = "删除";
          deleteButton.addEventListener("click", () => {
            annotations = annotations.filter((item) => item.id !== annotation.id);
            renderAnnotationList();
            persistDraft();
            status.textContent = "已删除批注";
            status.dataset.state = "synced";
          });
          row.append(content, deleteButton);
          annotationList.appendChild(row);
        });
      };

      const diffStates = (baseline, current) => {
        const before = new Map(baseline.map((entry) => [entry.id, entry.state]));
        const after = new Map(current.map((entry) => [entry.id, entry.state]));
        const ids = new Set([...before.keys(), ...after.keys()]);
        const normalizeDiffValue = (value) => {
          if (value === null || value === undefined) return null;
          if (typeof value === "number" && Number.isNaN(value)) return null;
          return value;
        };
        const fieldLabels = {
          text: "文案",
          xPercent: "X",
          yPercent: "Y",
          widthPercent: "宽度",
          heightPercent: "高度",
          fontSizePx: "字号",
          textColor: "文字色",
          backgroundColor: "背景色",
          visible: "显隐"
        };
        const changes = [];
        ids.forEach((id) => {
          const previous = before.get(id);
          const next = after.get(id);
          if (!previous) {
            changes.push({ id, field: "element", label: "元素", before: "不存在", after: "新增" });
            return;
          }
          if (!next) {
            changes.push({ id, field: "element", label: "元素", before: "存在", after: "已删除" });
            return;
          }
          Object.keys(fieldLabels).forEach((field) => {
            const previousValue = field === "xPercent" || field === "yPercent" || field === "widthPercent" || field === "heightPercent"
              ? previous.layout?.[field]
              : previous[field];
            const nextValue = field === "xPercent" || field === "yPercent" || field === "widthPercent" || field === "heightPercent"
              ? next.layout?.[field]
              : next[field];
            if (normalizeDiffValue(previousValue) !== normalizeDiffValue(nextValue)) {
              changes.push({
                id,
                field,
                label: fieldLabels[field],
                before: previousValue,
                after: nextValue
              });
            }
          });
        });
        return changes;
      };

      const renderSnapshotDiff = (changes) => {
        if (!compareBaseline) {
          snapshotDiffOutput.hidden = true;
          snapshotDiffOutput.innerHTML = "";
          return;
        }
        snapshotDiffOutput.hidden = false;
        snapshotDiffOutput.innerHTML = "";
        if (compareBaseline.pageId !== activePageId) {
          const row = document.createElement("div");
          const mark = document.createElement("strong");
          mark.textContent = "提示";
          const text = document.createElement("span");
          text.textContent = `基线来自“${getPageLabel(compareBaseline.pageId)}”，请切换到该页面后对比。`;
          row.append(mark, text);
          snapshotDiffOutput.appendChild(row);
          return;
        }
        if (!changes || changes.length === 0) {
          const row = document.createElement("div");
          const mark = document.createElement("strong");
          mark.textContent = "一致";
          const text = document.createElement("span");
          text.textContent = "当前页与基线一致。";
          row.append(mark, text);
          snapshotDiffOutput.appendChild(row);
          return;
        }
        changes.slice(0, 30).forEach((change) => {
          const row = document.createElement("div");
          const mark = document.createElement("strong");
          mark.textContent = change.id;
          const text = document.createElement("span");
          text.textContent = `${change.label}: ${String(change.before)} → ${String(change.after)}`;
          row.append(mark, text);
          snapshotDiffOutput.appendChild(row);
        });
      };

      const captureSnapshot = () => {
        syncActivePageState();
        compareBaseline = {
          pageId: activePageId,
          states: cloneStates(statesByPage.get(activePageId) || [])
        };
        renderSnapshotDiff([]);
        status.textContent = "已保存对比基线";
        status.dataset.state = "synced";
      };

      const compareSnapshot = () => {
        if (!compareBaseline) {
          status.textContent = "请先保存对比基线";
          status.dataset.state = "dirty";
          return;
        }
        if (compareBaseline.pageId !== activePageId) {
          renderSnapshotDiff(null);
          return;
        }
        syncActivePageState();
        const current = cloneStates(statesByPage.get(activePageId) || []);
        renderSnapshotDiff(diffStates(compareBaseline.states, current));
      };

      const clearSnapshot = () => {
        compareBaseline = null;
        renderSnapshotDiff(null);
        status.textContent = "已清除对比基线";
        status.dataset.state = "synced";
      };

      const renderMatrixDiff = (changesByPage) => {
        if (!matrixBaseline) {
          matrixDiffOutput.hidden = true;
          matrixDiffOutput.innerHTML = "";
          return;
        }
        matrixDiffOutput.hidden = false;
        matrixDiffOutput.innerHTML = "";
        const pageChanges = {};
        let totalChanges = 0;
        pageDefinitions.forEach((definition) => {
          const changes = changesByPage?.[definition.id] || [];
          pageChanges[definition.id] = changes;
          totalChanges += changes.length;
        });

        const grid = document.createElement("div");
        grid.className = "nur-matrix-grid";
        pageDefinitions.forEach((definition) => {
          const changes = pageChanges[definition.id];
          const cell = document.createElement("button");
          cell.type = "button";
          cell.className = "nur-matrix-cell";
          cell.dataset.level = changes.length > 0 ? "changed" : "same";
          const label = document.createElement("span");
          label.textContent = definition.label;
          const count = document.createElement("small");
          count.textContent = changes.length > 0 ? `${changes.length} 处差异` : "无变化";
          cell.append(label, count);
          cell.addEventListener("click", () => renderPage(definition.id));
          grid.appendChild(cell);
        });
        matrixDiffOutput.appendChild(grid);

        const detailHeading = document.createElement("strong");
        detailHeading.textContent = "差异明细";
        matrixDiffOutput.appendChild(detailHeading);

        if (totalChanges === 0) {
          const summary = document.createElement("div");
          summary.textContent = "六页内容均与全站基线一致。";
          matrixDiffOutput.appendChild(summary);
          return;
        }

        pageDefinitions.forEach((definition) => {
          const changes = pageChanges[definition.id];
          if (changes.length === 0) return;
          const section = document.createElement("div");
          const heading = document.createElement("strong");
          heading.textContent = definition.label;
          section.appendChild(heading);
          changes.slice(0, 30).forEach((change) => {
            const row = document.createElement("div");
            const mark = document.createElement("strong");
            mark.textContent = change.id;
            const text = document.createElement("span");
            text.textContent = `${change.label}: ${String(change.before)} → ${String(change.after)}`;
            row.append(mark, text);
            section.appendChild(row);
          });
          matrixDiffOutput.appendChild(section);
        });
      };

      const captureMatrix = () => {
        syncActivePageState();
        matrixBaseline = snapshotAll();
        renderMatrixDiff({});
        status.textContent = "已保存全站基线";
        status.dataset.state = "synced";
      };

      const compareMatrix = () => {
        if (!matrixBaseline) {
          status.textContent = "请先保存全站基线";
          status.dataset.state = "dirty";
          return;
        }
        syncActivePageState();
        const currentAll = snapshotAll();
        const changesByPage = {};
        pageDefinitions.forEach((definition) => {
          changesByPage[definition.id] = diffStates(matrixBaseline[definition.id] || [], currentAll[definition.id] || []);
        });
        renderMatrixDiff(changesByPage);
        status.textContent = "已生成跨页差异矩阵";
        status.dataset.state = "synced";
      };

      const clearMatrix = () => {
        matrixBaseline = null;
        renderMatrixDiff(null);
        status.textContent = "已清除全站基线";
        status.dataset.state = "synced";
      };

      const addAnnotation = () => {
        const text = annotationInput.value.trim();
        if (!text) {
          status.textContent = "批注内容为空";
          status.dataset.state = "dirty";
          return;
        }
        annotations.unshift({
          id: `a${Date.now()}`,
          pageId: activePageId,
          reviewId: selected?.dataset.reviewId || null,
          text,
          createdAt: new Date().toISOString()
        });
        annotationInput.value = "";
        renderAnnotationList();
        persistDraft();
        status.textContent = "已添加批注";
        status.dataset.state = "synced";
      };

      const renderArchiveList = () => {
        archiveList.innerHTML = "";
        archiveVersions.forEach((version) => {
          const row = document.createElement("div");
          row.className = "nur-archive-row";
          const time = document.createElement("time");
          time.textContent = new Date(version.createdAt).toLocaleString("zh-CN", { hour12: false });
          const restoreButton = document.createElement("button");
          restoreButton.type = "button";
          restoreButton.className = "nur-mini-button";
          restoreButton.textContent = "恢复";
          restoreButton.addEventListener("click", () => {
            if (!version.draft) return;
            pushHistory();
            applyReviewData(version.draft);
            setDirty();
          });
          row.append(time, restoreButton);
          archiveList.appendChild(row);
        });
      };

      const archiveCurrent = () => {
        archiveVersions.unshift({
          id: `v${Date.now()}`,
          createdAt: new Date().toISOString(),
          draft: collectReviewData()
        });
        if (archiveVersions.length > 20) archiveVersions.pop();
        renderArchiveList();
        persistDraft();
        status.textContent = "已归档";
        status.dataset.state = "synced";
      };

      const downloadJson = (payload, filename) => {
        const blob = new Blob([JSON.stringify(payload, null, 2)], { type: "application/json" });
        const url = URL.createObjectURL(blob);
        const link = document.createElement("a");
        link.href = url;
        link.download = filename;
        link.click();
        setTimeout(() => URL.revokeObjectURL(url), 1000);
      };

      const collectAIToUGUIBundle = () => {
        syncActivePageState();
        const buildNode = (pageId, descriptor) => {
          const entry = (statesByPage.get(pageId) || []).find((item) => item.id === descriptor.reviewId);
          const state = entry?.state || {
            style: descriptor.style || {},
            text: descriptor.text,
            textColor: descriptor.textColor || "#ffffff",
            backgroundColor: descriptor.backgroundColor || "#000000",
            uType: descriptor.uType,
            uName: descriptor.uName,
            visible: true,
            layout: {
              xPercent: Number.parseFloat(descriptor.style?.left),
              yPercent: Number.parseFloat(descriptor.style?.top),
              widthPercent: Number.parseFloat(descriptor.style?.width),
              heightPercent: Number.parseFloat(descriptor.style?.height)
            },
            fontSizePx: Number.parseFloat(descriptor.style?.fontSize) || null
          };
          const layout = state.layout || {};
          const styleString = [
            `left:${layout.xPercent ?? 0}%`,
            `top:${layout.yPercent ?? 0}%`,
            `width:${layout.widthPercent ?? 10}%`,
            `height:${layout.heightPercent ?? 10}%`
          ].join(";");
          const text = state.text === undefined ? null : state.text;
          return {
            name: state.uName || descriptor.uName || descriptor.reviewId,
            tag: descriptor.tag === "img" ? "img" : "div",
            controlType: descriptor.uType || "Div",
            role: descriptor.uType,
            elementId: descriptor.reviewId,
            attributes: [
              { name: "data-u-name", value: state.uName || descriptor.uName || "" },
              { name: "data-u-type", value: descriptor.uType || "Div" },
              { name: "style", value: styleString }
            ],
            classes: descriptor.className ? [descriptor.className] : [],
            text,
            layout: {
              position: "absolute",
              left: `${layout.xPercent ?? 0}%`,
              top: `${layout.yPercent ?? 0}%`,
              width: `${layout.widthPercent ?? 10}%`,
              height: `${layout.heightPercent ?? 10}%`
            },
            visual: {
              backgroundColor: state.backgroundColor || "#000000",
              opacity: state.visible === false ? "0" : "1"
            },
            textStyle: {
              color: state.textColor || "#ffffff",
              fontSize: state.fontSizePx ? `${state.fontSizePx}px` : null
            },
            children: (descriptor.children || []).map((child) => buildNode(pageId, child))
          };
        };

        return {
          schemaVersion: "1.0",
          site: {
            siteId: "neon-teahouse-ui",
            displayName: "霓虹茶舍 UI",
            designWidth: 1920,
            designHeight: 1080
          },
          theme: {
            themeId: "neon-teahouse-theme",
            displayName: "霓虹茶舍主题",
            pageBackground: "#0a1117",
            panelFill: "#040d13",
            cardFill: "#05141a",
            buttonFill: "#2d0e22",
            accentColor: "#79e6ef",
            textPrimary: "#f0f7f8",
            textSecondary: "#a7b0bd",
            outlineColor: "rgba(121,230,239,0.58)",
            shadowColor: "rgba(0,0,0,0.42)"
          },
          pages: pageDefinitions.map((definition) => ({
            pageId: definition.id,
            runtimePageId: definition.id,
            displayName: definition.label,
            prefabName: definition.prefabName,
            targetLayer: "Normal",
            logicalPath: `UI/Generated/neon-teahouse-ui/${definition.prefabName}`,
            root: {
              name: `${definition.id}Root`,
              tag: "div",
              controlType: "Div",
              role: "page",
              attributes: [{ name: "data-ui-page", value: definition.id }],
              classes: ["nur-page-content"],
              layout: {
                position: "absolute",
                left: "0%",
                top: "0%",
                width: "100%",
                height: "100%"
              },
              visual: { backgroundColor: "#0a1117", opacity: "1" },
              textStyle: {},
              children: definition.elements.map((descriptor) => buildNode(definition.id, descriptor))
            }
          }))
        };
      };

      const parseStoryText = (code) => {
        try {
          const evaluate = new Function("window", `${code}\nreturn window.NeonTeahouseStory;`);
          return evaluate({}) || null;
        } catch {
          return null;
        }
      };

      const setElementText = (pageId, reviewId, text) => {
        const states = statesByPage.get(pageId);
        if (!states) return;
        const entry = states.find((item) => item.id === reviewId);
        if (!entry) return;
        entry.state.text = String(text ?? "");
        if (pageId === activePageId) {
          const element = currentEditables.find((item) => item.dataset.reviewId === reviewId);
          const copy = element?.querySelector("[data-review-copy]");
          if (copy) copy.textContent = String(text ?? "");
        }
      };

      const applyStorySeed = (story) => {
        if (!story || typeof story !== "object") return false;
        const days = story.days || {};
        const dayKeys = Object.keys(days);
        const day = days[dayKeys[0]] || Object.values(days)[0] || null;
        const endings = story.endings || {};
        const ending = Object.values(endings)[0] || null;
        if (!day && !ending) return false;

        const previewLines = day?.conversation?.previewLines || [];
        const choices = day?.conversation?.choices || [];
        const introLines = day?.introLines || [];
        const teaProfile = day?.teaProfile || {};
        const ideal = teaProfile.ideal || {};
        const gate = day?.gate || {};
        const backroom = day?.backroom || {};
        const dayNumber = dayKeys[0] || String(day?.id || "1");

        setElementText("01-dialogue-panel", "sceneDayLabel", day?.title || "DAY 1 · 慈恩寺异稿");
        setElementText("01-dialogue-panel", "speakerName", previewLines[0]?.speaker || introLines[introLines.length - 1]?.speaker || "椎名立希");
        setElementText("01-dialogue-panel", "dialogueContent", day?.conversation?.prompt || previewLines[0]?.text || day?.description || "如果两份记忆都足够诚实，为什么系统只允许留下一份？");
        setElementText("01-dialogue-panel", "dialogueChoiceA", choices[0]?.label || "先保留差异，再追问来源");
        setElementText("01-dialogue-panel", "dialogueChoiceB", choices[1]?.label || "先选择可信的一份记录");

        setElementText("02-mixing-panel", "mixingTitle", `${day?.title || "第一夜"} · 茶饮调制`);
        setElementText("02-mixing-panel", "mixingHint", teaProfile.hint || "她需要温暖与安静，但太强的旧香会让别人的人生盖过她。");
        setElementText("02-mixing-panel", "mixingRecipeA", ideal.base ? `茶底：${ideal.base}` : "茶底：白茶");
        setElementText("02-mixing-panel", "mixingRecipeB", ideal.addon ? `辅料：${ideal.addon}` : "辅料：桂花");
        setElementText("02-mixing-panel", "mixingRecipeC", Array.isArray(ideal.temperature) ? `水温：${ideal.temperature[0]}-${ideal.temperature[1]}℃` : "水温：70-82℃");
        setElementText("02-mixing-panel", "mixingRecipeD", Array.isArray(ideal.steep) ? `冲泡：${ideal.steep[0]}-${ideal.steep[1]}s` : "冲泡：30-55s");

        setElementText("03-hud", "hudDayValue", String(dayNumber).replace("day", ""));
        setElementText("03-hud", "hudTimeValue", day?.clock || "OPEN 19:40");
        setElementText("03-hud", "hudWeatherIcon", String(day?.art?.backgroundAlt || "").includes("雨") ? "雨夜" : "长安");

        setElementText("04-announcement", "announcementTitle", gate.title || day?.title || "第一夜 · 慈恩寺的异稿");
        setElementText("04-announcement", "announcementDate", day?.clock || "OPEN 19:40");
        setElementText("04-announcement", "announcementBody", gate.description || day?.description || "旧灯第一次正式营业。");

        setElementText("05-backlog", "backlogTitle", backroom.recapTitle || gate.title || "慈恩寺的异稿");
        setElementText("05-backlog", "backlogLine1", backroom.recap || day?.description || "慈恩寺塔唱和留下不同而诚实的记载。");
        setElementText("05-backlog", "backlogLine2", day?.observation?.text || day?.description || "长崎素世认出千早爱音原始手账的针脚。");
        setElementText("05-backlog", "backlogLine3", backroom.clue || day?.clue || "异稿、旧纸针脚，以及第一次被说出的“千早爱音”。");

        if (ending) {
          setElementText("06-ending", "endingLabel", ending.label || "ENDING A / 留灯");
          setElementText("06-ending", "endingTitle", ending.title || "沿着灯继续寻找");
          setElementText("06-ending", "endingText", ending.text || "椎名立希没有找到千早爱音，也没有把裂隙中的未知写成幸存证明。");
          setElementText("06-ending", "endingQuote", ending.quote || "我寻找的不是过去替我留下的答案，而是她仍可能拥有的选择。");
        }
        renderInspector();
        return true;
      };

      const parseCssDeclarations = (styleText) => {
        const declarations = {};
        String(styleText || "").split(";").forEach((part) => {
          const separatorIndex = part.indexOf(":");
          if (separatorIndex <= 0) return;
          const property = part.slice(0, separatorIndex).trim();
          const value = part.slice(separatorIndex + 1).trim();
          if (property && value) declarations[property] = value;
        });
        return declarations;
      };

      const styleValueToPercent = (value, designSize, fallback) => {
        if (value === undefined || value === null || value === "") return fallback;
        const number = Number.parseFloat(value);
        if (!Number.isFinite(number)) return fallback;
        if (String(value).trim().endsWith("%")) return number;
        return Math.max(0, Math.min(100, (number / designSize) * 100));
      };

      const descriptorClassByType = (uType) => {
        if (uType === "button") return "nur-choice";
        if (uType === "image") return "nur-character";
        if (uType === "div" || uType === "scroll") return "nur-dialogue-panel";
        return "nur-body-copy";
      };

      const convertHtmlElementToDescriptor = (element, designSize, usedIds) => {
        const uType = element.getAttribute("data-u-type") || "div";
        const uName = element.getAttribute("data-u-name") || `element${usedIds.size + 1}`;
        const baseId = element.getAttribute("data-review-id") || `html-${uName}`;
        let reviewId = baseId;
        let suffix = 1;
        while (usedIds.has(reviewId)) {
          suffix += 1;
          reviewId = `${baseId}-${suffix}`;
        }
        usedIds.add(reviewId);

        const declarations = parseCssDeclarations(element.getAttribute("style"));
        const left = styleValueToPercent(declarations.left, designSize.width, 0);
        const top = styleValueToPercent(declarations.top, designSize.height, 0);
        const width = styleValueToPercent(declarations.width, designSize.width, 10);
        const height = styleValueToPercent(declarations.height, designSize.height, 10);
        const fontSize = Number.parseFloat(declarations["font-size"]);
        const isText = uType === "text" || uType === "button";
        const text = isText ? element.textContent.trim() : null;
        const children = Array.from(element.children)
          .filter((child) => child.hasAttribute("data-u-type"))
          .map((child) => convertHtmlElementToDescriptor(child, designSize, usedIds));

        return {
          reviewId,
          uType,
          uName,
          className: descriptorClassByType(uType),
          tag: uType === "image" ? "img" : "div",
          text,
          textColor: declarations.color || "#f0f7f8",
          backgroundColor: declarations["background-color"] || "#040d13",
          style: {
            left: `${left}%`,
            top: `${top}%`,
            width: `${width}%`,
            height: `${height}%`,
            fontSize: Number.isFinite(fontSize) ? `${Math.max(6, Math.min(72, fontSize))}px` : "12px"
          },
          src: element.getAttribute("src") || null,
          alt: element.getAttribute("alt") || "",
          children
        };
      };

      const firstLeafReviewId = (descriptors) => {
        for (const descriptor of descriptors) {
          if (descriptor.text !== null && descriptor.text !== undefined) return descriptor.reviewId;
          const childId = firstLeafReviewId(descriptor.children || []);
          if (childId) return childId;
        }
        return descriptors[0]?.reviewId || null;
      };

      const importHtmlSliceText = (text) => {
        const doc = new DOMParser().parseFromString(text, "text/html");
        const designSize = { width: 1920, height: 1080 };
        const allCandidates = Array.from(doc.querySelectorAll("[data-u-type][data-u-name]"));
        if (allCandidates.length === 0) return null;
        const topLevel = allCandidates.filter((element) => !element.parentElement?.closest("[data-u-type]"));
        const roots = topLevel.length > 0 ? topLevel : allCandidates;
        const usedIds = new Set();
        const elements = roots.map((element) => convertHtmlElementToDescriptor(element, designSize, usedIds));
        if (elements.length === 0) return null;

        const pageId = `html-slice-${Date.now()}`;
        const definition = {
          id: pageId,
          label: "HTML 切片",
          title: "HTML 切片审核",
          defaultReviewId: firstLeafReviewId(elements),
          prefabName: "HtmlSlicePanel",
          elements
        };
        pageDefinitions.push(definition);

        const container = document.createElement("div");
        container.dataset.page = pageId;
        container.hidden = true;
        elements.forEach((descriptor) => container.appendChild(createPageElement(descriptor)));
        canvas.appendChild(container);
        pageContainers.set(pageId, container);

        const defaults = snapshotElements(getPageElements(pageId));
        defaultsByPage.set(pageId, defaults);
        statesByPage.set(pageId, cloneStates(defaults));
        renderPage(pageId);
        renderValidation();
        setDirty();
        return pageId;
      };

      snapshotCaptureButton.addEventListener("click", captureSnapshot);
      snapshotCompareButton.addEventListener("click", compareSnapshot);
      snapshotClearButton.addEventListener("click", clearSnapshot);
      matrixCaptureButton.addEventListener("click", captureMatrix);
      matrixCompareButton.addEventListener("click", compareMatrix);
      matrixClearButton.addEventListener("click", clearMatrix);
      addAnnotationButton.addEventListener("click", addAnnotation);
      annotationInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter") addAnnotation();
      });
      validateButton.addEventListener("click", renderValidation);
      archiveButton.addEventListener("click", archiveCurrent);
      archiveCurrentButton.addEventListener("click", archiveCurrent);
      exportButton.addEventListener("click", () => {
        downloadJson(collectReviewData(), `neon-teahouse-ui-review-${new Date().toISOString().slice(0, 10)}.json`);
        status.textContent = "已导出 JSON";
        status.dataset.state = "synced";
      });
      exportAIToUGUIButton.addEventListener("click", () => {
        downloadJson(collectAIToUGUIBundle(), `neon-teahouse-aitougui-${new Date().toISOString().slice(0, 10)}.json`);
        status.textContent = "已导出 AIToUGUI";
        status.dataset.state = "synced";
      });
      loadStoryButton.addEventListener("click", () => storyFile.click());
      importHtmlSliceButton.addEventListener("click", () => htmlSliceFile.click());
      htmlSliceFile.addEventListener("change", async () => {
        const file = htmlSliceFile.files && htmlSliceFile.files[0];
        if (!file) return;
        try {
          const pageId = importHtmlSliceText(await file.text());
          if (!pageId) throw new Error("html slice parse failed");
          pushHistory();
          status.textContent = "已导入 HTML 切片";
          status.dataset.state = "dirty";
        } catch {
          status.textContent = "HTML 切片解析失败";
          status.dataset.state = "dirty";
        } finally {
          htmlSliceFile.value = "";
        }
      });
      storyFile.addEventListener("change", async () => {
        const file = storyFile.files && storyFile.files[0];
        if (!file) return;
        try {
          const story = parseStoryText(await file.text());
          if (!story) throw new Error("story.js parse failed");
          pushHistory();
          applyStorySeed(story);
          renderValidation();
          setDirty();
          status.textContent = "已从 story.js 生成";
          status.dataset.state = "dirty";
        } catch {
          status.textContent = "story.js 解析失败";
          status.dataset.state = "dirty";
        } finally {
          storyFile.value = "";
        }
      });
      importButton.addEventListener("click", () => importFile.click());
      importFile.addEventListener("change", async () => {
        const file = importFile.files && importFile.files[0];
        if (!file) return;
        try {
          const payload = JSON.parse(await file.text());
          pushHistory();
          applyReviewData(payload);
          renderValidation();
          setDirty();
        } catch {
          status.textContent = "导入失败";
          status.dataset.state = "dirty";
        } finally {
          importFile.value = "";
        }
      });

      syncButton.addEventListener("click", async () => {
        const payload = collectReviewData();
        syncButton.disabled = true;
        syncButton.querySelector("span").textContent = "同步中";
        try {
          if (window.openai && typeof window.openai.sendFollowUpMessage === "function") {
            await window.openai.sendFollowUpMessage({
              title: "同步 UI 审核草稿",
              prompt: [
                "请接收下面的 UI 审核草稿数据。先不要判定通过，等待我在对话中明确说“通过”。",
                "",
                JSON.stringify(payload, null, 2)
              ].join(String.fromCharCode(10))
            });
          } else {
            downloadJson(payload, `neon-teahouse-ui-review-${new Date().toISOString().slice(0, 10)}.json`);
          }
          status.textContent = "已同步";
          status.dataset.state = "synced";
        } finally {
          syncButton.disabled = false;
          syncButton.querySelector("span").textContent = "同步草稿";
        }
      });

      buildPageContainers();
      pageContainers.forEach((container, pageId) => {
        const defaults = snapshotElements(getPageElements(pageId));
        defaultsByPage.set(pageId, defaults);
        statesByPage.set(pageId, cloneStates(defaults));
      });
      renderPage(activePageId);

      const persisted = loadPersisted();
      if (persisted) {
        archiveVersions = Array.isArray(persisted.archives) ? persisted.archives : [];
        if (persisted.draft) applyReviewData(persisted.draft);
        if (Array.isArray(persisted.annotations)) {
          annotations = persisted.annotations
            .filter((annotation) => annotation && typeof annotation.id === "string" && typeof annotation.text === "string")
            .map((annotation) => ({ ...annotation }));
        }
        renderArchiveList();
        renderAnnotationList();
        status.textContent = "已加载本地草稿";
        status.dataset.state = "dirty";
      }
      renderValidation();
      updateHistoryButtons();
    })();
  </script>
</div>
